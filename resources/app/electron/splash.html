<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Buyer Log başlatılıyor</title>
<!-- AÇILIŞ EKRANI. BuyerLog.exe çalıştırıldığı anda gösterilir; sunucu hazır olup
     ana pencere görünene kadar kullanıcıya programın açılmakta olduğunu ve HANGİ
     adımda olduğunu söyler. Güncellemenin ilk açılışında başlık "Güncelleme
     uygulanıyor" olur ve kapatmama uyarısı görünür.
     Hızlı açılması için dış dosya yüklemez; renk değerleri startup-error.html
     yedekleriyle, hareket süreleri ui-tokens.css (--ui-motion-bar, --ui-ease)
     ile aynıdır. Adım metinleri yalnız bu dosyadadır; ana süreç yalnız adım
     kimliği gönderir (main.js → pushSplashState). -->
<style>
  :root{
    --paper:#f2f2f3; --card:#f8f8f9; --ink:#1d1f20; --ink2:#5d5d60; --muted:#7a7a7d;
    --line:#d4d4d7; --acc:#3f6488; --ok:#3d7a57;
    --sans:"Barlow",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    --head:"Barlow Condensed",var(--sans);
    --motion-bar:440ms; --ease:cubic-bezier(.2,.7,.3,1);
  }
  html,body{height:100%;margin:0;}
  body{
    background:var(--card); color:var(--ink); font-family:var(--sans);
    border:1px solid var(--line); box-sizing:border-box; padding:22px 28px 18px;
    display:flex; flex-direction:column; gap:10px;
    -webkit-user-select:none; user-select:none; cursor:default;
    -webkit-app-region:drag;
  }
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .brand{font-family:var(--head); font-weight:600; font-size:26px; letter-spacing:.02em;}
  .version{font-size:11px; color:var(--muted); font-family:var(--head); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;}
  .title{font-size:15px; font-weight:600; margin:0;}
  .hint{font-size:12px; line-height:1.4; color:var(--ink2); margin:0; min-height:0;}
  .hint:empty{display:none;}
  .bar{height:3px; background:var(--line); overflow:hidden; position:relative;}
  .fill{position:absolute; inset:0 auto 0 0; width:0; background:var(--acc); transition:width var(--motion-bar) var(--ease);}
  .bar::after{
    content:""; position:absolute; top:0; bottom:0; width:30%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    animation:slide 1.2s ease-in-out infinite;
  }
  @keyframes slide{0%{left:-30%;}100%{left:100%;}}
  .steps{list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; gap:3px; font-size:12.5px;}
  .steps li{display:flex; align-items:center; gap:8px; color:var(--muted); transition:color var(--motion-bar) var(--ease);}
  .steps li::before{
    content:""; flex:0 0 auto; width:8px; height:8px; border-radius:50%;
    border:1.5px solid var(--line); box-sizing:border-box;
  }
  .steps li[data-state="done"]{color:var(--ink2);}
  .steps li[data-state="done"]::before{background:var(--ok); border-color:var(--ok);}
  .steps li[data-state="active"]{color:var(--ink); font-weight:600;}
  .steps li[data-state="active"]::before{border-color:var(--acc); background:var(--acc);}
  .foot{margin-top:auto; display:flex; justify-content:space-between; gap:12px; font-size:11px; color:var(--muted);}
  .slow{color:var(--ink2);}
  @media (prefers-reduced-motion: reduce){
    .bar::after{animation:none; display:none;}
    .fill,.steps li{transition:none;}
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Buyer Log</div>
    <div class="version" id="version"></div>
  </div>
  <p class="title" id="title">Buyer Log başlatılıyor</p>
  <p class="hint" id="hint"></p>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <ol class="steps" id="steps" aria-label="Açılış adımları"></ol>
  <div class="foot">
    <span id="status" role="status" aria-live="polite"></span>
    <span id="elapsed"></span>
  </div>
<script>
(function () {
  'use strict';
  var TEXT = {
    tr: {
      titleStart: 'Buyer Log başlatılıyor',
      titleUpdate: 'Güncelleme uygulanıyor',
      hintUpdate: 'Yeni sürümün ilk açılışında dosyalar düzenlenir; bu birkaç dakika sürebilir. Lütfen Buyer Log’u kapatmayın.',
      hintSlow: 'Bu adım normalden uzun sürüyor. Buyer Log çalışıyor; lütfen kapatmayın.',
      stepsLabel: 'Açılış adımları',
      version: 'Sürüm {0}',
      stepOf: 'Adım {0} / {1}',
      elapsed: 'Geçen süre {0}',
      steps: {
        update: 'Yeni sürüm dosyaları doğrulandı',
        repair: 'Eski ekran önbelleği temizleniyor',
        data: 'Veri klasörü ve ayarlar hazırlanıyor',
        server: 'Buyer Log sunucusu başlatılıyor',
        database: 'Yerel veritabanı açılıyor',
        finish: 'Açılış işlemleri tamamlanıyor',
        screens: 'Ekranlar açılıyor'
      }
    },
    en: {
      titleStart: 'Starting Buyer Log',
      titleUpdate: 'Applying the update',
      hintUpdate: 'Files are being organized on the first launch of the new version; this may take a few minutes. Please do not close Buyer Log.',
      hintSlow: 'This step is taking longer than usual. Buyer Log is working; please do not close it.',
      stepsLabel: 'Startup steps',
      version: 'Version {0}',
      stepOf: 'Step {0} of {1}',
      elapsed: 'Elapsed {0}',
      steps: {
        update: 'New version files verified',
        repair: 'Clearing the previous screen cache',
        data: 'Preparing the data folder and settings',
        server: 'Starting the Buyer Log server',
        database: 'Opening the local database',
        finish: 'Finishing startup tasks',
        screens: 'Opening the screens'
      }
    }
  };
  var ORDER = { update: ['update', 'repair', 'data', 'server', 'database', 'finish', 'screens'],
                start: ['data', 'server', 'database', 'finish', 'screens'] };
  var SLOW_STEP_MS = 20000;
  var state = { mode: 'start', lang: 'tr', version: '', step: '', startedAt: Date.now() };
  var stepSince = Date.now();

  function fmt(text, a, b) { return String(text).replace('{0}', a).replace('{1}', b); }
  function clock(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60);
    s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function merge(next) {
    if (!next || typeof next !== 'object') return;
    if (next.mode === 'update' || next.mode === 'start') state.mode = next.mode;
    if (next.lang === 'en' || next.lang === 'tr') state.lang = next.lang;
    if (typeof next.version === 'string' && /^[0-9A-Za-z.+-]{0,40}$/.test(next.version)) state.version = next.version;
    var started = Number(next.startedAt);
    if (Number.isFinite(started) && started > 0 && started <= Date.now()) state.startedAt = started;
    if (typeof next.step === 'string' && ORDER[state.mode].indexOf(next.step) >= 0 && next.step !== state.step) {
      state.step = next.step;
      stepSince = Date.now();
    }
  }
  function render() {
    var t = TEXT[state.lang], order = ORDER[state.mode];
    var index = Math.max(0, order.indexOf(state.step));
    document.documentElement.lang = state.lang;
    document.title = state.mode === 'update' ? t.titleUpdate : t.titleStart;
    document.getElementById('title').textContent = document.title;
    document.getElementById('version').textContent = state.version ? fmt(t.version, state.version) : '';
    var slow = Date.now() - stepSince > SLOW_STEP_MS;
    var hint = document.getElementById('hint');
    hint.textContent = state.mode === 'update' ? t.hintUpdate : (slow ? t.hintSlow : '');
    hint.className = 'hint' + (slow ? ' slow' : '');
    var list = document.getElementById('steps');
    list.setAttribute('aria-label', t.stepsLabel);
    while (list.children.length > order.length) list.removeChild(list.lastChild);
    for (var i = 0; i < order.length; i += 1) {
      var item = list.children[i] || list.appendChild(document.createElement('li'));
      item.textContent = t.steps[order[i]];
      item.setAttribute('data-state', i < index ? 'done' : (i === index ? 'active' : 'todo'));
      if (i === index) item.setAttribute('aria-current', 'step'); else item.removeAttribute('aria-current');
    }
    document.getElementById('fill').style.width = Math.round((index + 1) / order.length * 100) + '%';
    document.getElementById('status').textContent = fmt(t.stepOf, index + 1, order.length) + ' · ' + t.steps[order[index]];
    tick();
  }
  function tick() {
    document.getElementById('elapsed').textContent = fmt(TEXT[state.lang].elapsed, clock(Date.now() - state.startedAt));
  }

  // Ana süreç yalnız bu tek giriş noktasını çağırır; değerler yukarıda doğrulanır.
  window.BLSplash = { update: function (next) { merge(next); render(); } };
  try {
    var q = new URLSearchParams(location.search);
    merge({ mode: q.get('mode'), lang: q.get('lang'), version: q.get('v') || '', step: q.get('step'), startedAt: q.get('t0') });
  } catch (_) {}
  if (!state.step) state.step = ORDER[state.mode][state.mode === 'update' ? 1 : 0];
  render();
  // Ana süreç uzun bir senkron işte meşgulken de süre ilerler: kullanıcı programın donmadığını görür.
  setInterval(function () {
    var wasSlow = document.getElementById('hint').className.indexOf('slow') >= 0;
    if (!wasSlow && Date.now() - stepSince > SLOW_STEP_MS) render(); else tick();
  }, 1000);
})();
</script>
</body>
</html>
