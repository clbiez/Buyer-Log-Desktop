<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Buyer Log başlatılıyor</title>
<!-- AÇILIŞ EKRANI. BuyerLog.exe çalıştırıldığı anda gösterilir; sunucu hazır olup
     ana pencere görünene kadar kullanıcıya programın açılmakta olduğunu söyler.
     Hızlı açılması için dış dosya yüklemez; token değerleri startup-error.html
     yedekleriyle aynıdır (design.css paleti). -->
<style>
  :root{
    --paper:#f2f2f3; --card:#f8f8f9; --ink:#1d1f20; --ink2:#5d5d60; --muted:#7a7a7d;
    --line:#d4d4d7; --acc:#3f6488;
    --sans:"Barlow",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    --head:"Barlow Condensed",var(--sans);
  }
  html,body{height:100%;margin:0;}
  body{
    background:var(--card); color:var(--ink); font-family:var(--sans);
    border:1px solid var(--line); box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; -webkit-user-select:none; user-select:none; cursor:default;
    -webkit-app-region:drag;
  }
  .brand{font-family:var(--head); font-weight:600; font-size:30px; letter-spacing:.02em;}
  .status{font-size:14px; color:var(--ink2);}
  .bar{width:220px; height:3px; background:var(--line); overflow:hidden; position:relative;}
  .bar::after{
    content:""; position:absolute; top:0; bottom:0; width:40%; background:var(--acc);
    animation:slide 1.2s ease-in-out infinite;
  }
  @keyframes slide{0%{left:-40%;}100%{left:100%;}}
  .version{font-size:11px; color:var(--muted); font-family:var(--head); letter-spacing:.08em; text-transform:uppercase; min-height:14px;}
  @media (prefers-reduced-motion: reduce){.bar::after{animation-duration:3s;}}
</style>
</head>
<body>
  <div class="brand">Buyer Log</div>
  <div class="bar" aria-hidden="true"></div>
  <div class="status" role="status">Buyer Log başlatılıyor…</div>
  <div class="version" id="version"></div>
<script>
  try {
    var v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('version').textContent = 'Sürüm ' + v;
  } catch (_) {}
</script>
</body>
</html>
