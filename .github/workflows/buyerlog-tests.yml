name: Buyer Log Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/bootstrap-collection-image-sync

permissions:
  contents: read

jobs:
  test:
    name: Node regression suite
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: resources/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Buyer Log tests
        run: npm test
