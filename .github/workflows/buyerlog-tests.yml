name: Buyer Log Tests

# GitHub Actions kotasını korumak için normal PR'lar otomatik test koşmaz.
# TEST yayınında zorunlu tam regresyon ayrıca korunur (buyerlog-test-release.yml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Test edilecek dal veya commit (boş = seçilen dal)
        required: false
        type: string

concurrency:
  group: buyerlog-tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node regression suite
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: resources/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate pending release notes
        run: npm run release:notes:validate
      - name: Check i18n coverage
        run: npm run i18n:check
      - name: Run full Buyer Log regression
        run: npm test
