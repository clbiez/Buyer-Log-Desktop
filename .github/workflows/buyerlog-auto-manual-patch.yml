name: Buyer Log Manual Patch Validation (signed publisher migration)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed main commit; validation only, no publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buyerlog-manual-patch-validation
  cancel-in-progress: false
jobs:
  validate-patch:
    # Legacy unsigned publication is deliberately frozen during the approved
    # signed-bootstrap migration. Existing installs/downloads are not modified.
    # A future signed publisher needs a separate explicit approval workflow.
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed source from main before running application code
        shell: pwsh
        env:
          REVIEWED_SHA: ${{ inputs.commit_sha }}
        run: |
          if ($env:REVIEWED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact reviewed source SHA is required.' }
          $main = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $main -ne $env:REVIEWED_SHA) { throw 'Reviewed source is not current main. Review the new source before validation.' }
          Write-Host "VALIDATION ONLY: $main. No patch publication is enabled."
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Install application dependencies
        working-directory: resources/app
        run: npm ci
      - name: Full application regression is required before patch packaging
        working-directory: resources/app
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Application regression failed; no patch will be built or published.' }
      - name: Resolve STABLE compatibility base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $release = Invoke-RestMethod -Uri 'https://raw.githubusercontent.com/clbiez/Buyer-Log-Releases/main/stable/latest.json' -TimeoutSec 30
          $version = [string]$release.version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid STABLE metadata.' }
          $sha = (& gh api "repos/$env:REPO/branches/updates/v$version" --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'STABLE source branch not found.' }
          $pkg = (& git show ($sha + ':resources/app/package.json') | Out-String | ConvertFrom-Json)
          if ([string]$pkg.version -ne $version) { throw 'STABLE source version differs from published STABLE.' }
          "BUYER_LOG_PATCH_BASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUYER_LOG_PATCH_BASE_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build isolated compatibility fixture (never published)
        shell: pwsh
        run: |
          python scripts/mini_patch_builder.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch build failed.' }
      - name: Retain Windows apply, compatibility and rollback validation
        shell: pwsh
        run: |
          python scripts/mini_patch_ci.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch compatibility or rollback failed.' }
      - name: Report migration boundary
        shell: pwsh
        run: |
          Write-Host 'Validation complete. No release, feed update or Actions ZIP artifact was created.'
          Write-Host 'Publishing remains disabled until the trusted signed bootstrap is implemented and its v3 acceptance gates pass.'
