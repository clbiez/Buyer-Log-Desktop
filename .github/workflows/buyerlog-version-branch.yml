name: Buyer Log immutable version branch

on:
  push:
    branches: [main]
    # Only version bumps need a pinned update branch. Ordinary PRs do not.
    paths:
      - 'resources/app/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buyerlog-version-branch
  cancel-in-progress: false

jobs:
  record-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create immutable updates/vVERSION branch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./resources/app/package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BRANCH="updates/v${VERSION}"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$SOURCE_SHA" ]]; then
              echo "::notice::${BRANCH} already immutably records ${REMOTE_SHA}; leaving it unchanged. Bump the version before a new release."
            else
              echo "Already recorded ${BRANCH}."
            fi
            exit 0
          fi
          git push origin "${SOURCE_SHA}:refs/heads/${BRANCH}"
          echo "Recorded ${SOURCE_SHA} as ${BRANCH}."
