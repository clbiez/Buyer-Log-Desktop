name: Buyer Log TEST release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      release_notes:
        description: Optional release notes
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/release-requests/test.json'
permissions:
  contents: read
concurrency:
  group: buyerlog-release-publish
  cancel-in-progress: false
jobs:
  full-regression:
    name: Full regression before TEST release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact TEST source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$DISPATCH_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then
            SOURCE_SHA="$(node -e "const x=require('./.github/release-requests/test.json');process.stdout.write(String(x.commit_sha||''))")"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Install and run full regression
        run: |
          npm ci --ignore-scripts
          npm test
  publish:
    needs: full-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve release request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.commit_sha }}
          DISPATCH_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$DISPATCH_SHA"
          RELEASE_NOTES="$DISPATCH_NOTES"
          if [[ "$EVENT_NAME" == "push" ]]; then
            REQUEST=".github/release-requests/test.json"
            SOURCE_SHA="$(node -e "const x=require('./${REQUEST}');process.stdout.write(String(x.commit_sha||''))")"
            RELEASE_NOTES="$(node -e "const x=require('./${REQUEST}');process.stdout.write(String(x.release_notes||''))")"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "SOURCE_SHA=${SOURCE_SHA,,}" >> "$GITHUB_ENV"
          {
            echo 'RELEASE_NOTES<<BUYERLOG_RELEASE_NOTES'
            printf '%s\n' "$RELEASE_NOTES"
            echo 'BUYERLOG_RELEASE_NOTES'
          } >> "$GITHUB_ENV"
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Deterministic install and existing validation
        working-directory: resources/app
        run: |
          npm ci --ignore-scripts
          npm run version:assert
      - name: Seal and validate visual release presentation
        working-directory: resources/app
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          npm run release:notes:seal -- "$SOURCE_VERSION"
      - name: Install Chromium for model image return acceptance
        working-directory: resources/app
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build one TEST artifact and manifest
        working-directory: resources/app
        env:
          BUYER_LOG_GITHUB_RELEASE_REPO: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          # CP/Orders görsel dönüşü gerçek sunucu + Chromium ile ölçülür; kabul
          # ölçütü sağlanmazsa TEST yayını üretilmez.
          BUYER_LOG_REQUIRE_IMAGE_ACCEPTANCE: '1'
        run: npm run release:build -- --allow-dirty --notes "$RELEASE_NOTES"
      - name: Sign release manifest (Ed25519)
        working-directory: resources/app
        env:
          # Private key exists only as a repository/environment secret; clients ship public keys only.
          BUYER_LOG_RELEASE_SIGNING_KEY: ${{ secrets.BUYER_LOG_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/release-signing.js sign dist-updates/latest.test.json
          node scripts/release-signing.js verify dist-updates/latest.test.json
      - name: Checkout public release-only repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          token: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          path: release-repo
          ref: main
      - name: Publish, verify remote bytes, then advance TEST latest
        working-directory: resources/app
        env:
          GH_TOKEN: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          BUYER_LOG_GITHUB_RELEASE_REPO: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          BUYER_LOG_RELEASE_REPO_DIR: ${{ github.workspace }}/release-repo
        run: node scripts/github-release.js publish-test
