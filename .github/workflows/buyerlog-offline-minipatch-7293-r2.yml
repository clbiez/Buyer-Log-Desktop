name: Buyer Log Offline Mini Patch 7.0.293 R2
on:
  push:
    branches:
      - tools/offline-minipatch-7-0-293-20261022-r2
    paths:
      - .github/workflows/buyerlog-offline-minipatch-7293-r2.yml
      - scripts/mini_patch_builder.py
      - scripts/mini_patch_installer.ps1
      - scripts/mini_patch_ci.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned source and previous patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Produce cumulative self-contained mini patch
        run: python scripts/mini_patch_builder.py
      - name: Test clean, initial and most recent mini patch paths on Windows
        run: python scripts/mini_patch_ci.py
      - name: Upload offline patch, no TEST or STABLE release
        uses: actions/upload-artifact@v4
        with:
          name: BuyerLog-7.0.293-MiniPatch-Guncel-R2
          path: dist/BuyerLog-7.0.293-MiniPatch-Son-Guncel-20261022-R2.zip
          if-no-files-found: error
          retention-days: 7
