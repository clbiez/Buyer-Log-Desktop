name: Buyer Log Offline Mini Patch 7.0.293 Updated 20261022
on:
  push:
    branches:
      - tools/offline-minipatch-7-0-293-20261022
    paths:
      - .github/workflows/buyerlog-offline-minipatch-7293-latest.yml
      - scripts/mini_patch_builder.py
      - scripts/mini_patch_installer.ps1
      - scripts/mini_patch_ci.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source and pinned previous version history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Produce cumulative self-contained mini patch ZIP
        run: python scripts/mini_patch_builder.py
      - name: Test clean and previously hotfixed 7.0.293 with rollback
        run: python scripts/mini_patch_ci.py
      - name: Publish ZIP as downloadable artifact, not TEST or STABLE
        uses: actions/upload-artifact@v4
        with:
          name: BuyerLog-7.0.293-MiniPatch-Latest-20261022
          path: dist/BuyerLog-7.0.293-Sonrasi-MiniPatch-Guncel-20261022.zip
          if-no-files-found: error
          retention-days: 7
