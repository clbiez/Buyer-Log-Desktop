name: Capture Buyer Log ROS demo screenshot
on:
  push:
    branches:
      - feat/ros-labdip-multi-colour-20261008
    paths:
      - resources/app/scripts/capture-ros-release-visual.js
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - name: Install app dependencies
        working-directory: resources/app
        run: npm ci --ignore-scripts
      - name: Install headless Chromium
        working-directory: resources/app
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render current Buyer Log with anonymous demo ROS data
        working-directory: resources/app
        run: node scripts/capture-ros-release-visual.js
      - name: Commit genuine post-change screenshot to PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Buyer Log Visual Test"
          git config user.email "buyer-log-visual-test@users.noreply.github.com"
          git add resources/app/public/release-notes/next-assets/ros-labdip-review-20261008.png
          git diff --cached --quiet && exit 1
          git commit -m "docs: authentic post-change ROS Lab Dip review screenshot"
          git push origin HEAD:feat/ros-labdip-multi-colour-20261008
