name: PLM Image Targeted Regression (temporary)
on:
  pull_request:
    paths:
      - 'resources/app/server/server.js'
      - 'resources/app/server/lib/model-image-refresh-leases.js'
      - 'resources/app/server/lib/collection-image-sync-policy.js'
      - 'resources/app/tests/model-image-local-first-perf.test.js'
      - 'resources/app/tests/plm-image-pipeline-v1100.test.js'
      - '.github/workflows/plm-image-regression-temp.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Targeted tests (only; no installer or release)
        run: node --test tests/model-image-local-first-perf.test.js tests/collection-image-sync-policy.test.js tests/plm-image-pipeline-v1100.test.js tests/model-asset-architecture-v1110.test.js
