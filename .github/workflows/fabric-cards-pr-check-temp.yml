name: Fabric Cards PR Verification (temporary)
on:
  push:
    branches:
      - fix/fabric-cards-auto-ai-learning-20261023
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test tests/fabric-cards.test.js tests/cp-orders-fabric-cards.test.js
