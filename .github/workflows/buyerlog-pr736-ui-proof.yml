name: Buyer Log PR736 temporary real UI proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    if: github.event.pull_request.number == 736
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Buyer Log and headless Chromium dependencies
        run: |
          cd resources/app
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/bl-playwright --no-save playwright@1.56.1 --no-audit --no-fund
          if ! command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
            test -n "$CHROME"
            sudo ln -s "$CHROME" /usr/bin/chromium
          fi
      - name: Launch real Buyer Log with isolated generated demo records
        env:
          BL_PLAYWRIGHT: /tmp/bl-playwright/node_modules/playwright
        run: |
          node docs/ai/ui-rebuild/tools/session.cjs resources/app > /tmp/bl-pr736-session.log 2>&1 &
          echo $! > /tmp/bl-pr736-pid
          for i in $(seq 1 180); do
            if grep -q '"status":"ready"' /tmp/bl-pr736-session.log; then exit 0; fi
            if ! kill -0 "$(cat /tmp/bl-pr736-pid)" 2>/dev/null; then cat /tmp/bl-pr736-session.log; exit 1; fi
            sleep 2
          done
          cat /tmp/bl-pr736-session.log
          exit 1
      - name: Validate CP Orders Collection and capture real post-change PNG
        env:
          NODE_PATH: /tmp/bl-playwright/node_modules
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.connectOverCDP('http://127.0.0.1:9231');
            const context=browser.contexts()[0];
            const page=context.pages()[0];
            assert.ok(page);
            await page.waitForLoadState('domcontentloaded');
            const intro=page.getByText("Buyer Log'a devam et",{exact:false});
            if(await intro.isVisible().catch(()=>false)) await intro.click({timeout:30000});
            await page.waitForFunction(()=>!document.getElementById('blBootGuard'),null,{timeout:60000});
            await page.waitForTimeout(1400);
            await page.evaluate(()=>document.querySelector('.blRnDialog[open]')?.close());
            for(const tab of ['cp','orders','koleksiyon']){
              await page.evaluate(()=>document.querySelector('.blRnDialog[open]')?.close());
              await page.locator('nav.tabs button[data-tab="'+tab+'"]').click({timeout:15000});
              await page.waitForTimeout(850);
              const v=await page.evaluate(key=>{
                const pre=key==='koleksiyon'?'kol':key;
                return {mode:window.BLTableDensity?.get(key),mount:document.getElementById(pre+'TableViewActions')!==null,
                  densityControls:document.querySelectorAll('[data-density-control]').length,
                  actionsButtons:document.querySelectorAll('[data-table-command-palette]').length,
                  actualTable:document.getElementById(pre+'Table')?.dataset.tableDensity};
              },tab);
              assert.equal(v.mode,'compact',tab+' fixed density');
              assert.ok(v.mount,tab+' toolbar');
              assert.equal(v.densityControls,0,tab+' Rows absent');
              assert.equal(v.actionsButtons,0,tab+' Actions absent');
              assert.equal(v.actualTable,'compact',tab+' DOM density');
              console.log('PASS '+tab+' '+JSON.stringify(v));
            }
            await page.keyboard.press('Control+Shift+k');
            await page.locator('.blCmdOverlay:not([hidden])').waitFor({timeout:8000});
            await page.keyboard.press('Escape');
            await page.evaluate(()=>document.querySelector('.blRnDialog[open]')?.close());
            await page.locator('nav.tabs button[data-tab="cp"]').click({timeout:15000});
            await page.waitForTimeout(900);
            fs.mkdirSync('resources/app/public/release-notes/next-assets',{recursive:true});
            await page.screenshot({path:'resources/app/public/release-notes/next-assets/table-compact-no-extra-controls.png',animations:'disabled'});
            const img=fs.readFileSync('resources/app/public/release-notes/next-assets/table-compact-no-extra-controls.png');
            console.log('PR736_PNG_BASE64_BEGIN');
            console.log(img.toString('base64'));
            console.log('PR736_PNG_BASE64_END');
            console.log('Screenshot bytes '+img.length);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Archive UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr736-real-ui-proof
          path: resources/app/public/release-notes/next-assets/table-compact-no-extra-controls.png
          if-no-files-found: warn
          retention-days: 3
      - name: Print isolated runtime diagnostics on error
        if: failure()
        run: cat /tmp/bl-pr736-session.log || true
