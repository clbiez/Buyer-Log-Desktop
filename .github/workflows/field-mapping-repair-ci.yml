name: Field Mapping Repair Test Gate
on:
  pull_request:
    branches:
      - fix/refresh-field-mapping-repair-main
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: resources/app/package-lock.json
      - run: npm ci
      - run: npm test
