name: Buyer Log PR fast checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: buyerlog-pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fast-checks:
    name: Agent contract, i18n and visual notes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Core Node-only checks; no npm ci or full regression on ordinary PRs.
      - name: Agent instructions, i18n and release-note contract
        run: node --test tests/agent-instructions.test.js tests/i18n-coverage-guard.test.js tests/visual-release-notes-v70211.test.js tests/page-horizon-badges-removal-v20261025.test.js
      - name: Motion+ diagonal wave, reduced-motion and Manifest contracts
        run: node --test tests/motion-plus-contract-v20261025.test.js tests/motion-plus-refresh-sync-v20261026.test.js tests/ui-manifest-contract.test.js tests/ui-inline-contract.test.js tests/design-token-guard.test.js
      - name: Thinking Orbs startup and navigation regression
        run: node --test tests/boot-thinking-orb-v20260929.test.js tests/startup-guide-v20260930.test.js tests/navigation-revisit-perf-v250.test.js
      - name: Release version, lock, SBOM and artifact bytes
        run: |
          node --test tests/dependency-inventory-metadata.test.js
          node scripts/dependency-inventory.js --check
      - name: Patch source and backup path contracts
        run: node --test tests/signed-patch-producer-cli.test.js tests/user-data-owned-temp.test.js
      - name: Clock-skew and seeded synchronization scenarios
        run: |
          node --test --test-name-pattern="OneDrive simulation: 10 devices|HLC simulation" tests/sync-simulation-v20261009.test.js
      - name: Personal order notes and edit-authority isolation
        run: node --test tests/private-order-notes-v20261026.test.js tests/personal-order-note-columns-v20261026.test.js
      - name: Validate nonempty pending release notes
        run: |
          node -e "const n=require('./public/release-notes/next.json');if(n.changes?.length)require('./scripts/release-notes').validateNext();else if(n.publishedAt)throw Error('Empty pending notes must have blank publishedAt')"
