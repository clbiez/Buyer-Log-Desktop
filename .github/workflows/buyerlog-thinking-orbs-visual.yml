name: Buyer Log Thinking Orbs visual capture
on:
  push:
    branches:
      - fix/restore-thinking-orbs-20261026
permissions:
  contents: read
jobs:
  capture:
    name: Real startup screenshot (isolated demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: resources/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies and browser controller
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Capture actual Buyer Log loading orb and output PNG
        run: node scripts/capture-thinking-orbs-ci.js
