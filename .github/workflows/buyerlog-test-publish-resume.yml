name: Buyer Log TEST publish resume
# Completes a TEST publication whose gated run already passed full regression,
# built and signed the artifact, and uploaded it, but failed while advancing
# the public TEST pointer. Nothing is rebuilt: the existing signed public bytes
# are re-verified against the immutable updates/vVERSION source.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Already signed and uploaded TEST semantic version
        required: true
        type: string
      verified_run_id:
        description: Buyer Log TEST release run whose full regression and signing succeeded
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: buyerlog-release-publish
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-only publisher
        uses: actions/checkout@v4
        with:
          path: release-publisher
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve immutable source and verify the gated run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          RUN_ID: ${{ github.event.inputs.verified_run_id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/updates/v${VERSION}" --jq '.object.sha' 2>/dev/null || true)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::updates/v${VERSION} is not recorded"; exit 1; }
          RUN_PATH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.path')"
          [[ "$RUN_PATH" == ".github/workflows/buyerlog-test-release.yml" ]] || { echo "::error::run ${RUN_ID} is not a TEST release run"; exit 1; }
          JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100")"
          job_id() { jq -r --arg n "$1" '[.jobs[]|select(.name==$n)][0].id // empty' <<<"$JOBS"; }
          REGRESSION_ID="$(job_id 'Full regression before TEST release')"
          PUBLISH_ID="$(job_id 'publish')"
          [[ -n "$REGRESSION_ID" && -n "$PUBLISH_ID" ]] || { echo "::error::run ${RUN_ID} lacks regression/publish jobs"; exit 1; }
          REGRESSION="$(jq -r --arg n 'Full regression before TEST release' '.jobs[]|select(.name==$n)|.conclusion' <<<"$JOBS")"
          [[ "$REGRESSION" == "success" ]] || { echo "::error::full regression concluded ${REGRESSION}"; exit 1; }
          for STEP in 'Verify checkout' 'Seal and validate visual release presentation' 'Build one TEST artifact and manifest' 'Sign release manifest (Ed25519)'; do
            RESULT="$(jq -r --arg s "$STEP" '.jobs[]|select(.name=="publish")|.steps[]|select(.name==$s)|.conclusion' <<<"$JOBS")"
            [[ "$RESULT" == "success" ]] || { echo "::error::publish step '${STEP}' concluded ${RESULT:-missing}"; exit 1; }
          done
          for JOB in "$REGRESSION_ID" "$PUBLISH_ID"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB}/logs" > "$RUNNER_TEMP/job-${JOB}.log"
            grep -qF "$SOURCE_SHA" "$RUNNER_TEMP/job-${JOB}.log" || { echo "::error::job ${JOB} did not check out ${SOURCE_SHA}"; exit 1; }
          done
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "Verified run ${RUN_ID} gated ${VERSION} at ${SOURCE_SHA}."
      - name: Checkout exact immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout public release-only repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          token: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          path: release-repo
          ref: main
      - name: Verify signed public bytes, then advance TEST latest
        env:
          GH_TOKEN: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          BUYER_LOG_GITHUB_RELEASE_REPO: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          BUYER_LOG_RELEASE_REPO_DIR: ${{ github.workspace }}/release-repo
          BUYER_LOG_RELEASE_APP_ROOT: ${{ github.workspace }}/source/resources/app
          VERSION: ${{ github.event.inputs.version }}
        run: node release-publisher/.github/scripts/buyerlog-release-distribution.js resume-test "$VERSION"
