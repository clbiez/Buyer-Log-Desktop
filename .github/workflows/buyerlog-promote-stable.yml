name: Buyer Log promote STABLE
on:
  workflow_dispatch:
    inputs:
      version:
        description: Verified TEST semantic version to promote without rebuilding
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/release-requests/stable.json'
permissions:
  contents: write
concurrency:
  group: buyerlog-release-publish
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve promotion request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          PROMOTE_VERSION="$DISPATCH_VERSION"
          if [[ "$EVENT_NAME" == "push" ]]; then
            PROMOTE_VERSION="$(node -e "const x=require('./.github/release-requests/stable.json');process.stdout.write(String(x.version||''))")"
          fi
          [[ "$PROMOTE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "PROMOTE_VERSION=$PROMOTE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout public release-only repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          token: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          path: release-repo
          ref: main
      - name: Verify TEST and publish identical STABLE bytes
        working-directory: resources/app
        env:
          GH_TOKEN: ${{ secrets.BUYER_LOG_RELEASE_TOKEN }}
          BUYER_LOG_GITHUB_RELEASE_REPO: ${{ vars.BUYER_LOG_RELEASE_REPO }}
          BUYER_LOG_RELEASE_REPO_DIR: ${{ github.workspace }}/release-repo
        run: node scripts/github-release.js promote-stable "$PROMOTE_VERSION"

      - name: Persist immutable visual release archive
        working-directory: resources/app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notes.js seal "$PROMOTE_VERSION" --reset
          cd "$GITHUB_WORKSPACE"
          git config user.name "Buyer Log Release Bot"
          git config user.email "buyer-log-release-bot@users.noreply.github.com"
          git add -A resources/app/public/release-notes
          if ! git diff --cached --quiet; then
            git commit -m "Archive visual release notes $PROMOTE_VERSION"
            git push origin HEAD:main
          fi
