<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buyer Log Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: 56px kompakt ikon rayı (üzerine gelince açılır) + yapışkan komut çubuğu + 12 sütun yoğun kart ızgarası.
   Üç yön aynı bileşenleri paylaşır; yalnız tokenlar değişir: A Industry Lite · B Gece Vardiyası · C Atölye. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --line:#dfe3e8; --line-2:#c9cfd6;
  --ink:#1b1f24; --ink-2:#555e68; --muted:#8a929c;
  --acc:#3f6488; --acc-2:#5b8cbf; --on-acc:#ffffff; --acc-soft:#e6edf4;
  --rail:#1d2d3d; --rail-ink:#b9c8d8; --rail-hi:#ffffff;
  --good:#177a4c; --warn:#a86b00; --bad:#b42318;
  --glow:rgba(63,100,136,.16); --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.06);
  --r:6px; --r-lg:8px;
  --texture:none;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Barlow",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --row:30px; --pad:12px; --gap:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1016; --surface:#121922; --surface-2:#17202b; --line:#222e3c; --line-2:#334255;
  --ink:#e8eef5; --ink-2:#a3b1c2; --muted:#6f7e90; --acc:#8fb4d8; --acc-2:#5fd3f3; --on-acc:#0b1016; --acc-soft:#1b2a3a;
  --rail:#070b10; --rail-ink:#8da0b5; --rail-hi:#ffffff; --good:#7cd58c; --warn:#f0b44c; --bad:#ef5b5b;
  --glow:rgba(95,211,243,.2); --shadow:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.35); --r:10px; --r-lg:12px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1016; --surface:#121922; --surface-2:#17202b; --line:#222e3c; --line-2:#334255;
  --ink:#e8eef5; --ink-2:#a3b1c2; --muted:#6f7e90; --acc:#8fb4d8; --acc-2:#5fd3f3; --on-acc:#0b1016; --acc-soft:#1b2a3a;
  --rail:#070b10; --rail-ink:#8da0b5; --rail-hi:#ffffff; --good:#7cd58c; --warn:#f0b44c; --bad:#ef5b5b;
  --glow:rgba(95,211,243,.2); --shadow:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.35); --r:10px; --r-lg:12px; color-scheme:dark}
/* Yön seçimi (JS ile) sistem temasını ezer */
:root:root[data-dir="a"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --line:#dfe3e8; --line-2:#c9cfd6;
  --ink:#1b1f24; --ink-2:#555e68; --muted:#8a929c; --acc:#3f6488; --acc-2:#5b8cbf; --on-acc:#ffffff; --acc-soft:#e6edf4;
  --rail:#1d2d3d; --rail-ink:#b9c8d8; --rail-hi:#ffffff; --good:#177a4c; --warn:#a86b00; --bad:#b42318;
  --glow:rgba(63,100,136,.16); --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.06); --r:6px; --r-lg:8px; --texture:none; color-scheme:light}
:root:root[data-dir="b"]{
  --bg:#0b1016; --surface:#121922; --surface-2:#17202b; --line:#222e3c; --line-2:#334255;
  --ink:#e8eef5; --ink-2:#a3b1c2; --muted:#6f7e90; --acc:#8fb4d8; --acc-2:#5fd3f3; --on-acc:#0b1016; --acc-soft:#1b2a3a;
  --rail:#070b10; --rail-ink:#8da0b5; --rail-hi:#ffffff; --good:#7cd58c; --warn:#f0b44c; --bad:#ef5b5b;
  --glow:rgba(95,211,243,.2); --shadow:0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.35); --r:10px; --r-lg:12px; --texture:none; color-scheme:dark}
:root:root[data-dir="c"]{
  --bg:#eef1f0; --surface:#fbfcfc; --surface-2:#f2f5f4; --line:#d9e0de; --line-2:#c2ccc9;
  --ink:#16201f; --ink-2:#4f5d5b; --muted:#85918f; --acc:#1f6f78; --acc-2:#c58b2b; --on-acc:#ffffff; --acc-soft:#dcebec;
  --rail:#13393d; --rail-ink:#b7d0d0; --rail-hi:#ffffff; --good:#2f7d4f; --warn:#a96a00; --bad:#b4322a;
  --glow:rgba(31,111,120,.18); --shadow:0 2px 0 rgba(19,57,61,.05),0 8px 24px rgba(19,57,61,.08); --r:14px; --r-lg:18px;
  --texture:repeating-linear-gradient(60deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(-60deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px); color-scheme:light}
:root[data-density="compact"]{--row:26px;--pad:9px;--gap:9px}
:root[data-density="comfy"]{--row:36px;--pad:16px;--gap:16px}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-family:var(--sans);font-size:10.5px}

/* ---------- Öneri çubuğu ---------- */
.proposal{position:fixed;left:50%;width:max-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line-2);border-radius:16px;padding:7px 9px;box-shadow:0 18px 50px rgba(0,0,0,.22);max-width:calc(100vw - 24px)}
.proposal .lbl{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.segc{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;position:relative}
.segc button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center;position:relative;z-index:1;transition:color .2s}
.segc button[aria-pressed="true"]{color:var(--on-acc)}
.segc .pill{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--acc);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1)}
.sw{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.tgl{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tgl[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

/* ---------- Kabuk ---------- */
.app{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;z-index:40;width:56px;background:var(--rail);background-image:var(--texture);color:var(--rail-ink);display:flex;flex-direction:column;transition:width .35s cubic-bezier(.2,.9,.2,1),box-shadow .35s;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.rail:hover,.rail:focus-within{width:212px;box-shadow:20px 0 50px rgba(0,0,0,.25)}
.railTop{display:flex;align-items:center;gap:10px;padding:12px 11px;height:56px}
.logo{width:34px;height:34px;flex:none;border-radius:calc(var(--r) + 2px);display:grid;place-items:center;font:700 14px var(--display);color:var(--rail);background:linear-gradient(135deg,#fff,var(--rail-ink));position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.9) 80%,transparent 90%);animation:spin 4s linear infinite;mix-blend-mode:overlay}
@keyframes spin{to{transform:rotate(360deg)}}
.railTop b{font:600 17px var(--display);color:var(--rail-hi);white-space:nowrap}
.railTop small{display:block;font:400 10.5px var(--mono);opacity:.6}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px;position:relative;scrollbar-width:none}
.grp{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.45;padding:10px 8px 4px;white-space:nowrap;height:24px}
.rail:not(:hover):not(:focus-within) .grp{opacity:0}
.nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;padding:0 8px;height:34px;border-radius:var(--r);cursor:pointer;white-space:nowrap;position:relative;z-index:1;font-size:13px;transition:color .2s}
.nav button:hover{color:var(--rail-hi)}
.nav button[aria-current="page"]{color:var(--rail-hi);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.nav .badge{margin-left:auto;font:600 10px var(--mono);background:#ef5b5b;color:#fff;border-radius:999px;padding:1px 6px}
.rail:not(:hover):not(:focus-within) .nav .badge{position:absolute;left:24px;top:3px;margin:0;padding:0 4px;font-size:9px}
.ind{position:absolute;left:8px;right:8px;height:34px;border-radius:var(--r);background:rgba(255,255,255,.1);transition:top .45s cubic-bezier(.3,1.25,.5,1);z-index:0;box-shadow:inset 3px 0 0 var(--acc-2)}
.railFoot{padding:8px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px}
.railFoot button{display:flex;gap:12px;align-items:center;border:0;background:none;color:inherit;height:32px;padding:0 8px;border-radius:var(--r);cursor:pointer;white-space:nowrap;font-size:12.5px}
.railFoot button:hover{background:rgba(255,255,255,.08)}
.railFoot svg{width:18px;height:18px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.topIn{display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb small{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crumb h1{font:600 22px/1.05 var(--display);margin:0;letter-spacing:.01em;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;transition:border-color .2s,transform .2s;white-space:nowrap}
.chip:hover{border-color:var(--acc);transform:translateY(-1px)}
.chip b{color:var(--ink);font-weight:600}
.chip .x{opacity:.5}
.cmd{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--r) + 2px);padding:6px 10px;min-width:220px;color:var(--muted);cursor:text;transition:border-color .2s,box-shadow .2s}
.cmd:hover{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.cmd kbd{margin-left:auto;font:500 10.5px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--ink-2)}
.cmd svg{width:15px;height:15px}
.sync{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc-2));color:var(--on-acc);display:grid;place-items:center;font:700 12px var(--display);flex:none}
@media (max-width:760px){.cmd{min-width:0;flex:1;order:5}.sync{display:none}}

.content{padding-block:14px 110px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));flex:1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1180px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:560px){.c3{grid-column:span 12}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad);box-shadow:var(--shadow);min-width:0;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--mx,-500px) var(--my,-500px),var(--glow),transparent 65%);opacity:.9}
.card:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.card>*{position:relative}
.cardH{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cardH h3{margin:0;font:600 15px var(--display);letter-spacing:.03em}
.cardH small{color:var(--muted);font-size:11.5px}
.link{border:0;background:none;color:var(--acc);font-weight:600;font-size:12px;cursor:pointer;padding:2px 4px;border-radius:4px}
.link:hover{background:var(--acc-soft)}

/* KPI */
.kpiRow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
@media (max-width:1180px){.kpiRow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpiRow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .l{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:11.5px;font-weight:600;display:inline-flex;gap:3px;align-items:center;padding:1px 6px;border-radius:999px}
.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.kpi svg{display:block;width:100%;height:30px;margin-top:6px}
.kpi:hover{transform:translateY(-2px)}

/* Akış şeridi */
.ribbon{display:flex;height:44px;border-radius:var(--r);overflow:hidden;gap:2px;margin-top:4px}
.ribbon>div{flex:var(--f) 1 0;background:var(--c);position:relative;cursor:pointer;display:flex;align-items:center;padding:0 8px;color:#0b1016;font:600 11.5px var(--mono);white-space:nowrap;overflow:hidden;transition:flex-grow .5s cubic-bezier(.3,1,.4,1),filter .2s;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 8px,transparent 8px 16px);background-size:40px 100%;animation:stripe 2s linear infinite}
.ribbon>div:hover{filter:brightness(1.1);flex-grow:calc(var(--f) * 1.5)}
@keyframes stripe{to{background-position:40px 0}}
.rleg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
@media (max-width:760px){.rleg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rleg div{border-left:3px solid var(--c);padding:2px 0 2px 8px}
.rleg span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rleg b{font:700 18px var(--display);font-variant-numeric:tabular-nums}

/* AI kartı */
.ai{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--surface)),var(--surface) 60%)}
.ai .orb{width:34px;height:34px;border-radius:50%;background:conic-gradient(from var(--a,0deg),var(--acc),var(--acc-2),var(--acc));animation:orb 3s linear infinite;flex:none;position:relative}
.ai .orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes orb{to{--a:360deg}}
.ai p{margin:8px 0;min-height:4.2em;font-size:13.5px;line-height:1.5}
.ai p .caret{display:inline-block;width:7px;height:14px;background:var(--acc);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 11px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:transform .15s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{box-shadow:0 6px 18px var(--glow)}

/* Listeler */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:calc(var(--row) + 12px);border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,padding .2s}
.li:last-child{border-bottom:0}
.li::before{content:"";align-self:stretch;margin:6px 0;border-radius:2px;background:var(--c)}
.li:hover{background:var(--surface-2);padding-left:4px}
.li .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t code{font:500 11px var(--mono);color:var(--acc)}
.li .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .q{text-align:right;font:600 14px var(--display);white-space:nowrap}
.li .q small{display:block;font:500 10.5px var(--sans);color:var(--c)}
.li .acts{display:flex;gap:4px;opacity:0;transform:translateX(6px);transition:all .2s}
.li:hover .acts{opacity:1;transform:none}

/* Takvim ısı şeridi */
.cal{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.cal i{aspect-ratio:1.6;border-radius:3px;background:color-mix(in srgb,var(--acc) var(--p),var(--surface-2));display:block;transition:transform .2s;cursor:default}
.cal i:hover{transform:scale(1.25);outline:1px solid var(--acc)}
.cal i.today{outline:2px solid var(--acc-2);outline-offset:1px}
.cal span{display:flex;align-items:center}

/* Donut */
.donut{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center}
.donut svg{width:130px;height:130px}
.dleg div{display:flex;gap:7px;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.dleg div:last-child{border:0}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}

/* Zaman çizgisi */
.feed{position:relative;padding-left:16px}
.feed::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line)}
.feed div{position:relative;padding:4px 0 8px;font-size:12.5px}
.feed div::before{content:"";position:absolute;left:-16px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--c)}
.feed div.new::before{background:var(--c);animation:ping 1.6s infinite;box-shadow:0 0 0 0 var(--c)}
.feed small{display:block;color:var(--muted);font-size:11px}

/* Üretici barları */
.sup{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.sup .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.sup .tr i{display:block;height:100%;width:var(--w);border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc-2))}
.sup b{text-align:right;font-variant-numeric:tabular-nums}

/* Tablo */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);transition:all .2s}

.search{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;background:var(--surface);margin-left:auto}

.t th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.t td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--line);white-space:nowrap}
.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.t tbody tr{cursor:pointer;transition:background .15s}
.t tbody tr:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.t tbody tr.in{animation:rin .4s ease both;animation-delay:calc(min(var(--i),30) * 16ms)}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
.pillS{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 65%,var(--ink))}
.pillS::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.prog{width:90px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:3px}
.thumbM{width:24px;height:24px;border-radius:5px;display:inline-grid;place-items:center;font:700 9px var(--mono);color:#fff;vertical-align:middle;margin-right:6px}

/* Görünüm geçişleri + iskelet */
.view{display:none}
.view.on{display:block}
.view.on .stag{animation:stag .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes stag{from{opacity:0;transform:translateY(14px) scale(.985)}}
.skel{position:relative;overflow:hidden;background:var(--surface-2);border-radius:var(--r)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);animation:shim 1.2s infinite}

/* Pinler */
.pin{position:absolute;z-index:20;width:22px;height:22px;border-radius:50%;background:var(--acc-2);color:#0b1016;font:700 11px var(--mono);display:grid;place-items:center;box-shadow:0 0 0 4px var(--glow);cursor:help;border:0;animation:pinIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--acc-2);opacity:0;animation:ring 2s infinite;animation-delay:calc(var(--i) * 200ms)}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes pinIn{from{transform:scale(0)}}
.notes{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:76px;z-index:55;width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 170px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:0 30px 70px rgba(0,0,0,.28);padding:14px;animation:nIn .45s cubic-bezier(.2,1.2,.3,1) both}

.notes li{counter-increment:n;display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:12.5px;color:var(--ink-2)}
.notes li::before{content:counter(n);width:22px;height:22px;border-radius:50%;background:var(--acc-2);color:#0b1016;font:700 11px var(--mono);display:grid;place-items:center}

.notes .dirs div{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12px;color:var(--ink-2)}
.notes .dirs b{color:var(--ink)}

.pal{position:fixed;inset:0;z-index:80;display:grid;place-items:start center;padding:12vh 16px 16px;background:rgba(5,10,15,.35);backdrop-filter:blur(6px)}

.palC input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;font-size:15px;outline:none}

.palL div{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px}
.palL div small{margin-left:auto;color:var(--muted);font:500 10.5px var(--mono)}
.palL div.on{background:var(--acc-soft);color:var(--acc)}
.palL .sec{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px;cursor:default}

.scrim{position:fixed;inset:0;z-index:70;background:rgba(5,10,15,.35);opacity:0;pointer-events:none;transition:opacity .3s}

const INSIGHTS = () => {
  const late = orders.filter(o => o.stage === 'late'), sup = BL.group('supplier').find(s => late.some(o => o.supplier === s.k));
  const air = shipments.filter(s => s.delayed && s.mode === 'sea').length;
  return [
    `${late.length} sipariş Ex-F tarihini geçti ve toplam ${fmt(sum(late, o => o.qty))} adet bekliyor. En büyük pay ${sup ? sup.k : ''} üreticisinde; hatırlatma e-postası taslağı hazır.`,
    `Denizyolundaki ${air} sevkiyatın In Store tamponu negatif. Bu siparişlerden ${Math.min(4, air)} tanesini havayoluna kaydırmak tamponu ortalama 9 gün iyileştirir.`,
    `Önümüzdeki 30 günde ${fmt(proj[29].cArr)} adetin antrepoya girmesi bekleniyor. H44 haftası kapasite eşiğini %14 aşıyor; iki yüklemeyi H45'e kaydırmak dengeler.`
  ];
};
let aiI = 0, aiTimer;
function typeAI() {
  const el = $('#aiText'); if (!el) return; clearInterval(aiTimer);
  const txt = INSIGHTS()[aiI % 3]; let n = 0;
  if (RM()) { el.innerHTML = esc(txt); return; }
  aiTimer = setInterval(() => { n += 2; el.innerHTML = esc(txt.slice(0, n)) + '<span class="caret"></span>'; if (n >= txt.length) { clearInterval(aiTimer); el.innerHTML = esc(txt) + '<span class="caret"></span>'; } }, 18);
}

/* ---------- Siparişler ---------- */
let oFilter = 'all', oQuery = '';
function ordersView() {
  const chips = [['all', 'Tümü', orders.length], ...STAGES.map(s => [s.k, s.short, byStage.find(b => b.k === s.k).n])];
  return `<div class="toolbar stag" style="--i:0">${chips.map(c => `<button class="fchip" data-f="${c[0]}" aria-pressed="${oFilter === c[0]}">${c[1]} <em>${c[2]}</em></button>`).join('')}
    <label class="search"><svg width="14" height="14"><use href="#i-search"/></svg><input id="oq" placeholder="Sipariş, model, üretici…" value="${esc(oQuery)}" aria-label="Siparişlerde ara"></label></div>
    <div class="tbl stag" style="--i:1" data-pin="7"><table class="t"><thead><tr><th>Sipariş</th><th>Model</th><th>Buyer</th><th>Lisans</th><th>Üretici</th><th style="text-align:right">Adet</th><th>Aşama</th><th>İlerleme</th><th>Ex-F</th><th>ETA</th><th>Risk</th></tr></thead><tbody id="obody"></tbody></table></div>`;
}
function fillOrders() {
  const q = oQuery.toLowerCase();
  const rows = orders.filter(o => (oFilter === 'all' || o.stage === oFilter) && (!q || (o.id + o.model + o.supplier + o.license + o.buyer).toLowerCase().includes(q))).slice(0, 120);
  const pal = ['#3f6488', '#1f6f78', '#a98bea', '#c58b2b', '#4fa3e0', '#3cc6b4'];
  $('#obody').innerHTML = rows.map((o, i) => { const s = stageOf(o.stage), r = riskOf(o.risk); const p = o.stage === 'prod' ? o.prodPct : o.stage === 'late' ? 1 : o.stage === 'transit' ? o.progress : 1; return `<tr class="in" style="--i:${i}" data-id="${o.id}"><td style="font-family:var(--mono);font-size:11.5px">${o.id}</td><td><span class="thumbM" style="background:${pal[i % 6]}">${o.model.slice(4)}</span>${o.model}</td><td>${o.buyer}</td><td>${o.license}</td><td>${esc(o.supplier)}</td><td class="n">${fmt(o.qty)}</td><td><span class="pillS" style="--c:${s.color}">${s.short}</span></td><td><span class="prog"><i style="--w:${Math.round(p * 100)}%;--c:${s.color}"></i></span></td><td>${fdate(o.exf)}</td><td>${fdate(o.eta)}</td><td><span class="pillS" style="--c:${r.color}">${r.tr}</span></td></tr>`; }).join('') || `<tr><td colspan="11" style="text-align:center;padding:30px;color:var(--muted)">“${esc(oQuery)}” için sipariş yok. Aramayı temizleyin.</td></tr>`;
}

/* ---------- Backlog ---------- */
function backlogView() {
  const bg = BL.group('buyer');
  return `<div class="grid">
    <div class="card c12 stag" style="--i:0;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 16%,var(--surface)),var(--surface) 55%)" data-pin="8"><div class="cardH"><div><h3 style="font-size:20px">Backlog rapor stüdyosu</h3><small>HTML, PDF ve Excel çıktıları tek tıkla · animasyonlu sunum modu</small></div><a class="btn pri" href="${REPORT_URL}" target="_blank" rel="noopener" id="repLink">Raporu aç ↗</a></div>
      <div class="ribbon" style="height:30px">${byStage.map(s => `<div style="--c:${s.color};--f:${s.qty}" data-t="${s.tr} · ${fmt(s.qty)}">${s.qty / total > .08 ? s.short : ''}</div>`).join('')}</div></div>
    <div class="card c7 stag" style="--i:1"><div class="cardH"><h3>Buyer grup kırılımı</h3><small>adet · aşama dağılımı</small></div>
      ${bg.map(g => `<div class="sup" style="grid-template-columns:minmax(0,110px) minmax(0,1fr) 70px"><span class="nm">${g.k}</span><span style="display:flex;height:12px;border-radius:3px;overflow:hidden;gap:1px;width:${(g.qty / bg[0].qty * 100).toFixed(0)}%;animation:gx 1s cubic-bezier(.2,.9,.2,1) both">${g.st.map((q, i) => q ? `<i style="flex:${q} 1 0;background:${STAGES[i].color}"></i>` : '').join('')}</span><b>${fmtK(g.qty)}</b></div>`).join('')}</div>
    <div class="card c5 stag" style="--i:2"><div class="cardH"><h3>30 gün projeksiyon</h3><small>kümülatif antrepo girişi</small></div>${spark(proj.map(p => p.cArr), 'var(--acc-2)', 300, 120).replace('<svg', '<svg style="width:100%;height:150px"')}<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>${fdate(proj[0].day)}</span><b style="color:var(--ink);font:700 20px var(--display)">${fmt(proj[29].cArr)}</b><span>${fdate(proj[29].day)}</span></div></div>
  </div>`;
}
function otherView(k) {
  const n = NAV.find(x => x.k === k);
  return `<div class="grid">${[0, 1, 2, 3].map(i => `<div class="card c3 stag" style="--i:${i}"><div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:30px;width:70%;margin-top:10px"></div><div class="skel" style="height:24px;margin-top:10px"></div></div>`).join('')}
    <div class="card c12 stag" style="--i:4;text-align:center;padding:40px 16px"><h3 style="font:600 22px var(--display);margin:0">${n.t}</h3><p style="color:var(--ink-2);max-width:52ch;margin:8px auto 14px">Bu demo Genel Bakış, Siparişler ve Backlog ekranlarını yeni dille gösteriyor. ${n.t} aynı kart, tablo ve çekmece bileşenleriyle yeniden çizilir.</p><button class="btn pri" data-go="overview">Genel Bakış’a dön</button></div></div>`;
}

/* ---------- yönlendirme ---------- */
let cur = 'overview';
function go(k) {
  cur = k; const n = NAV.find(x => x.k === k);
  $$('#nav button').forEach(b => { if (b.dataset.k === k) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  moveInd();
  $('#pageTitle').textContent = n.t; $('#crumbG').textContent = GROUP_OF[k];
  const vid = ['overview', 'orders', 'backlog'].includes(k) ? k : 'other';
  $$('.view').forEach(v => v.classList.remove('on'));
  const v = $('#v-' + vid);
  v.innerHTML = vid === 'overview' ? overview() : vid === 'orders' ? ordersView() : vid === 'backlog' ? backlogView() : otherView(k);
  void v.offsetWidth; v.classList.add('on');
  bindView(v); scrollTo({ top: 0 });
  if (notesOn) setTimeout(placePins, 60);
}
function bindView(v) {
  $$('.card', v).forEach(spot);
  $$('[data-count]', v).forEach(countUp);
  $$('[data-go]', v).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $$('[data-t]', v).forEach(el => { el.addEventListener('mousemove', e => showTip(el.dataset.t, e.clientX, e.clientY)); el.addEventListener('mouseleave', hideTip); });
  $$('.ribbon>div[data-s]', v).forEach(el => el.addEventListener('click', () => { oFilter = STAGES[+el.dataset.s].k; go('orders'); }));
  $$('.li[data-id]', v).forEach(el => el.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a) { e.stopPropagation(); toast(a.dataset.a === 'mail' ? 'E-posta taslağı LCW AI ile hazırlandı · onay bekliyor' : 'Hatırlatma yarın 09:00’a ertelendi'); return; } openOrder(byId[el.dataset.id]); }));
  if ($('#aiText', v)) { typeAI(); $('#aiNext').addEventListener('click', () => { aiI++; typeAI(); }); $('#aiGo').addEventListener('click', () => toast('Öneri önizlemesi açıldı · uygulamak için onay gerekir')); }
  if ($('#obody', v)) {
    fillOrders();
    $$('.fchip', v).forEach(b => b.addEventListener('click', () => { oFilter = b.dataset.f; $$('.fchip', v).forEach(x => x.setAttribute('aria-pressed', x === b)); fillOrders(); }));
    $('#oq').addEventListener('input', e => { oQuery = e.target.value; fillOrders(); });
    $('#obody').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) openOrder(byId[tr.dataset.id]); });
  }
}

/* ---------- çekmece ---------- */
function openOrder(o) {
  if (!o) return; const s = stageOf(o.stage), r = riskOf(o.risk), si = BL.SI[o.stage];
  const steps = ['Sipariş', 'Örme', 'Ex-F', 'Yükleme', 'Antrepo', 'Depo'];
  const nowI = [1, 2, 3, 4, 4, 5][si];
  $('#dH').innerHTML = `<small style="font:500 10.5px var(--mono);letter-spacing:.1em;color:${s.color}">${s.tr.toUpperCase()}</small><h4>${o.id} · ${o.model}</h4><div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap"><span class="chip">${o.license}</span><span class="chip">${o.product} · ${o.gauge}</span><span class="chip">${o.season}</span></div>`;
  $('#dB').innerHTML = `<div class="steps" id="dsteps">${steps.map((x, i) => `<div class="${i < nowI ? 'ok' : i === nowI ? 'now' : ''}"><i></i>${x}</div>`).join('')}</div>
    <div class="kv" style="margin-top:14px"><div><span>Adet</span><b>${fmt(o.qty)}</b></div><div><span>Üretici</span><b>${esc(o.supplier)}</b></div><div><span>Ex-F plan → güncel</span><b>${fdate(o.exfPlan)} → ${fdate(o.exf)}</b></div><div><span>ETA · ${MODES[o.mode].tr}</span><b>${fdateL(o.eta)}</b></div><div><span>In Store plan</span><b>${fdateL(o.inStorePlan)}</b></div><div><span>Tampon</span><b style="color:${r.color}">${o.slack} gün</b></div></div>
    <div class="card" style="margin-top:12px;border-color:${r.color}"><b style="color:${r.color}">● ${r.tr}</b><div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${o.revs ? o.revs + ' Ex-F revizyonu var. ' : ''}${o.stage === 'late' ? 'Ex-F geçti, yükleme bekleniyor.' : o.slack < 0 ? 'Tahmini In Store tarihi planı aşıyor.' : 'Plan içinde ilerliyor.'}</div></div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn pri" id="dMail">Üreticiye hatırlat</button><button class="btn" id="dAi">LCW AI’a sor</button></div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => requestAnimationFrame(() => $('#dsteps').style.setProperty('--p', (nowI / (steps.length - 1) * 100) + '%')));
  $('#dMail').addEventListener('click', () => toast('Hatırlatma taslağı hazır · gönderim için onay gerekir'));
  $('#dAi').addEventListener('click', () => toast('LCW AI paneli bu siparişin bağlamıyla açıldı (demo)'));
}
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); }
$('#dX').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);

/* ---------- komut paleti ---------- */
function openPalette() {
  if ($('.pal')) return;
  const items = [
    ...NAV.filter(n => n.k).map(n => ({ sec: 'Modüller', t: n.t, k: 'Git', run: () => go(n.k) })),
    { sec: 'Komutlar', t: 'Backlog raporu oluştur (PDF)', k: 'Rapor', run: () => window.open(REPORT_URL + '#pdf', '_blank') },
    { sec: 'Komutlar', t: 'Excel Backlog V3 indir', k: 'Rapor', run: () => window.open(REPORT_URL + '#excel', '_blank') },
    { sec: 'Komutlar', t: 'Veri modelinden güncelle', k: 'Senkron', run: () => { toast('Veri modeli güncellendi · 3 değişiklik'); $('#syncT').textContent = 'PLM senkron · az önce'; } },
    { sec: 'Komutlar', t: 'Yönü değiştir: Gece Vardiyası', k: 'Görünüm', run: () => setDir('b') },
    ...orders.slice(0, 60).map(o => ({ sec: 'Siparişler', t: `${o.id} · ${o.model} · ${o.supplier}`, k: stageOf(o.stage).short, run: () => openOrder(o) }))
  ];
  const el = document.createElement('div'); el.className = 'pal';
  el.innerHTML = `<div class="palC" role="dialog" aria-label="Komut paleti"><input id="palQ" placeholder="Ara: modül, komut, sipariş…" aria-label="Komut ara"><div class="palL" id="palL"></div></div>`;
  document.body.appendChild(el);
  let sel = 0, list = [];
  const render = () => {
    const q = $('#palQ').value.toLowerCase(); list = items.filter(i => i.t.toLowerCase().includes(q)).slice(0, 14); sel = Math.min(sel, Math.max(0, list.length - 1));
    let h = '', last = ''; list.forEach((it, i) => { if (it.sec !== last) { h += `<div class="sec">${it.sec}</div>`; last = it.sec; } h += `<div class="${i === sel ? 'on' : ''}" data-i="${i}">${esc(it.t)}<small>${it.k}</small></div>`; });
    $('#palL').innerHTML = h || '<div class="sec">Sonuç yok</div>';
  };
  const close = () => el.remove();
  const run = i => { const it = list[i]; close(); if (it) it.run(); };
  $('#palQ').addEventListener('input', () => { sel = 0; render(); });
  $('#palQ').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); render(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); } if (e.key === 'Enter') run(sel); if (e.key === 'Escape') close(); });
  $('#palL').addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) run(+d.dataset.i); });
  el.addEventListener('click', e => { if (e.target === el) close(); });
  render(); $('#palQ').focus();
}
$('#cmdOpen').addEventListener('click', openPalette);
$('#cmdOpen').addEventListener('keydown', e => { if (e.key === 'Enter') openPalette(); });
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); } if (e.key === 'Escape') { closeDrawer(); const p = $('.pal'); if (p) p.remove(); } });

/* ---------- öneri kontrolleri ---------- */
function movePills() { $$('.segc').forEach(s => { const b = s.querySelector('button[aria-pressed="true"]'), p = s.querySelector('.pill'); if (b && p) { p.style.left = b.offsetLeft + 'px'; p.style.width = b.offsetWidth + 'px'; } }); }
function setDir(d, ev) {
  const apply = () => { root.dataset.dir = d; $$('#dirSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === d)); movePills(); };
  if (ev) { root.style.setProperty('--vx', ev.clientX + 'px'); root.style.setProperty('--vy', ev.clientY + 'px'); }
  if (document.startViewTransition && !RM()) document.startViewTransition(apply); else apply();
  try { localStorage.setItem('blp-dir', d); } catch (e) { }
}
$$('#dirSeg button').forEach(b => b.addEventListener('click', e => setDir(b.dataset.dir, e)));
$$('#denSeg button').forEach(b => b.addEventListener('click', () => { root.dataset.density = b.dataset.den; $$('#denSeg button').forEach(x => x.setAttribute('aria-pressed', x === b)); movePills(); if (notesOn) setTimeout(placePins, 50); }));
$('#motionBtn').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); root.dataset.motion = on ? 'on' : 'off'; });
$('#themeBtn').addEventListener('click', e => { const order = ['a', 'b', 'c']; setDir(order[(order.indexOf(root.dataset.dir) + 1) % 3], e); });
$('#langBtn').addEventListener('click', () => toast('TR/EN: tüm metinler L(tr,en) çiftleriyle anında değişir (demo)'));

const NOTES = [
  ['Kompakt ray', '216px menü 56px ikon rayına iner; üzerine gelince etiketlerle açılır. Aktif gösterge yaylı animasyonla kayar. Telefonda alt sekme çubuğu olur.'],
  ['Komut paleti · Ctrl K', 'Modül, sipariş ve komutlara klavyeden erişim. “Backlog PDF oluştur” gibi işlemler tek satırdan.'],
  ['Kapsam çipleri', 'Sezon, Buyer ve Lisans filtresi başlıkta tek yerde; tüm modüllere aynı kapsam uygulanır.'],
  ['Canlı KPI şeridi', 'Sayılar sayarak gelir, mini çizgi grafik kendini çizer, değişim rozeti renkle anlam taşır.'],
  ['Akan sipariş şeridi', 'Aşamalar tek bantta; çizgili akış hareketi “süreç ilerliyor” hissi verir. Tıklayınca o aşamanın siparişleri açılır.'],
  ['LCW AI içgörü kartı', 'Deterministik veriden üretilen tek cümlelik öneri; yazı efektiyle gelir, yalnız onayla uygulanır.'],
  ['Yoğun tablo', 'Satır yüksekliği yoğunluk ayarına bağlı (26/30/36px). Satırlar kademeli belirir, ilerleme çubuğu ve durum hapı tek bakışta okunur.'],
  ['Rapor stüdyosu', 'Backlog çıktıları (HTML, PDF, Excel) tek kartta; animasyonlu sunum modu ayrı sayfada açılır.']
];
let notesOn = false;
function placePins() {
  const box = $('#pins'); box.innerHTML = '';
  if (!notesOn) return;
  $$('[data-pin]').forEach(el => { if (!el.offsetParent && el.id !== 'scope') return; const r = el.getBoundingClientRect(); if (!r.width) return; const p = document.createElement('button'); p.className = 'pin'; p.textContent = el.dataset.pin; p.style.setProperty('--i', el.dataset.pin); p.style.left = (r.left + scrollX - 8) + 'px'; p.style.top = (r.top + scrollY - 8) + 'px'; p.title = NOTES[el.dataset.pin - 1][0]; p.addEventListener('click', () => toast(NOTES[el.dataset.pin - 1][0])); box.appendChild(p); });
  const rail = $('.rail').getBoundingClientRect(); const p1 = document.createElement('button'); p1.className = 'pin'; p1.textContent = '1'; p1.style.setProperty('--i', 1); p1.style.position = 'fixed'; p1.style.left = (rail.right - 14) + 'px'; p1.style.top = (rail.top + 64) + 'px'; p1.title = NOTES[0][0]; box.appendChild(p1);
}
$('#pins').style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;z-index:20';
$('#notesBtn').addEventListener('click', e => {
  notesOn = !notesOn; e.currentTarget.setAttribute('aria-pressed', notesOn);
  const ex = $('.notes'); if (ex) ex.remove();
  if (notesOn) {
    const n = document.createElement('div'); n.className = 'notes';
    n.innerHTML = `<h4>Neyi değiştiriyoruz?</h4><div style="font-size:12px;color:var(--muted)">Kompakt, yalın, hareketli. Mevcut çelik mavisi kimlik korunur.</div><ol>${NOTES.map(x => `<li><span><b>${x[0]}</b>${x[1]}</span></li>`).join('')}</ol>
      <div class="dirs"><div><b>A · Industry Lite</b> Bugünkü “Industry” temasının evrimi: koyu ray, açık zemin, 6px köşe, tek çelik mavisi vurgu.</div><div><b>B · Gece Vardiyası</b> Kontrol odası: koyu zemin, camgöbeği parıltı, imleci izleyen ışık. Uzun ekran başı ve sunum için.</div><div><b>C · Atölye</b> Triko dokulu ray, yuvarlak kartlar, petrol yeşili + iplik hardalı. Daha sıcak ve markaya yakın.</div></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:10px">Bütün tokenlar design.css anahtarlarıyla eşleşir; Excel çıktısının okuduğu tablo başlığı ve rozet renkleri değişmez.</div>`;
    document.body.appendChild(n);
  }
  placePins();
});
addEventListener('resize', () => { movePills(); moveInd(); if (notesOn) placePins(); });
addEventListener('scroll', () => { if (notesOn) placePins(); }, { passive: true });

// canlı senkron metni
let ago = 0; setInterval(() => { ago++; $('#syncT').textContent = `PLM senkron · ${ago} dk önce`; }, 60000);
// yeni hareket simülasyonu
setInterval(() => {
  const f = $('#feed'); if (!f || RM()) return;
  const o = orders[Math.floor(Math.random() * orders.length)], s = stageOf(o.stage);
  const d = document.createElement('div'); d.className = 'new'; d.style.setProperty('--c', s.color); d.style.animation = 'stag .5s ease both';
  d.innerHTML = `<b>${o.id} · ${s.tr}</b><small>${esc(o.supplier)} · ${fmt(o.qty)} adet · şimdi</small>`;
  $$('.new', f).forEach(x => x.classList.remove('new'));
  f.prepend(d); if (f.children.length > 5) f.lastElementChild.remove();
}, 6000);

/* ---------- başlat ---------- */
let initial = 'a';
try { initial = localStorage.getItem('blp-dir') || ''; } catch (e) { }
if (!initial) initial = (root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'b' : 'a';
root.dataset.dir = initial; root.dataset.density = 'compact';
$$('#dirSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === initial));
buildNav(); buildScope(); go('overview'); movePills();
if (document.fonts) document.fonts.ready.then(() => { movePills(); moveInd(); });
})();

</script>
