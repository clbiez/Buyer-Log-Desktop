 }
 function updatePlay(){
  $('#play').innerHTML=icon(playing?'stop':'play',14)+t(playing?'Durdur':'Geçişi oynat',playing?'Stop':'Play transition');
 }
 // The existing Motion+ service owns creation, cancellation, visibility and
 // reduced-motion handling. Retarget only its returned study animations.
 function sharedAnimation(s,element,frames,ms,delay=0,easing='var'){
  const a=BLMotionPlus.play(element===s.outer?'expand':'overlay',element);
  if(!a)return null;
  a.effect.setKeyframes(frames);
  a.effect.updateTiming({duration:ms,delay,fill:'both',easing:easing==='var'?getComputedStyle(root).getPropertyValue('--ui-ease').trim():easing});
  s.animations.add(a);
  a.finished.then(()=>{if(element!==s.outer&&!s.open)return;s.animations.delete(a);a.cancel();},()=>s.animations.delete(a));
  return a;
 }
 function setOpen(s,open,animate=true){
  if(s.open===open&&!s.animations.size){settle(s);return Promise.resolve();}
  const startHeight=s.outer.hidden?0:s.outer.getBoundingClientRect().height;
  const startOpacity=s.outer.hidden?0:parseFloat(getComputedStyle(s.outer).opacity);
  const wasVisible=elementVisible(s.button);
  s.serial++;const serial=s.serial;
  s.animations.forEach(a=>a.cancel());s.animations.clear();
  if(!open&&s.inner.contains(document.activeElement))s.button.focus({preventScroll:true});
  s.open=open;s.button.setAttribute('aria-expanded',String(open));
  s.outer.setAttribute('aria-hidden','false');s.inner.inert=!open;
  s.outer.hidden=false;s.outer.style.height='auto';
  const fullHeight=s.inner.getBoundingClientRect().height;
  if(!animate||!enabled()||!wasVisible){settle(s);return Promise.resolve();}
  const p=profile(s),kind=s.mode||mode,ms=duration(s)*(open?1:.78),endHeight=open?fullHeight:0;
  // Keep the wrapper measurable for the shared Motion+ visibility guard.
  s.outer.style.height=Math.max(startHeight,1)+'px';
  let frames=[{height:startHeight+'px',opacity:kind==='slide'||kind==='spring'?1:startOpacity},{height:endHeight+'px',opacity:kind==='slide'||kind==='spring'?1:(open?1:0)}];
  if(kind==='spring'&&open){const over=Math.min(8,fullHeight*.035);frames=[{height:startHeight+'px',opacity:1,offset:0},{height:(fullHeight+over)+'px',opacity:1,offset:.72},{height:(fullHeight-2)+'px',opacity:1,offset:.9},{height:fullHeight+'px',opacity:1,offset:1}];}
  const a=sharedAnimation(s,s.outer,frames,ms,0,kind==='spring'?'linear':'var');
  s.outer.style.height=open?'auto':'0px';
  if(!a){settle(s);return Promise.resolve();}
  if(kind==='soft')sharedAnimation(s,s.inner,[{transform:`translateY(${open?-5:0}px)`},{transform:`translateY(${open?0:-3}px)`}],ms);
  if(kind==='stagger'){
   const rows=Array.from((s.inner.querySelector('.tools-list')||s.inner).children).slice(0,6);
   rows.forEach((row,i)=>{
    const delay=open?i*32*speed:0;
    const span=open?Math.max(100*speed,ms-delay):ms*.6;
    sharedAnimation(s,row,open?[{opacity:0,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}]:[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-4px)'}],span,delay);
   });
  }
  return a.finished.catch(()=>{}).then(()=>{if(serial===s.serial)settle(s);});
 }
 function toggle(s){
  stopRun();const open=!s.open;
  if(open&&$('#single-open').checked)states.filter(x=>x.group===s.group&&x!==s&&x.open).forEach(x=>setOpen(x,false));
  setOpen(s,open);
 }
 function mountAccordions(){
  states=all('.accordion').map(el=>{
   const s={el,button:el.querySelector('.accordion-trigger'),outer:el.querySelector('.panel-outer'),inner:el.querySelector('.panel-inner'),mode:el.closest('[data-mode]')?.dataset.mode,group:el.closest('.accordion-group'),open:el.dataset.initial==='open',serial:0,animations:new Set()};
   s.button.setAttribute('aria-expanded',String(s.open));s.outer.setAttribute('aria-hidden',String(!s.open));settle(s);
   s.button.addEventListener('click',()=>toggle(s));
   s.button.addEventListener('keydown',e=>{
    const peers=states.filter(x=>x.group===s.group);const at=peers.indexOf(s);
    const next=e.key==='ArrowDown'?peers[(at+1)%peers.length]:e.key==='ArrowUp'?peers[(at+peers.length-1)%peers.length]:e.key==='Home'?peers[0]:e.key==='End'?peers[peers.length-1]:null;
    if(next){e.preventDefault();next.button.focus();}
   });return s;
  });
 }
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 async function play(){
  if(playing){stopRun();settleAll();return;}
  stopRun();settleAll();playing=true;updatePlay();const token=run;
  const groups=view==='app'?[$('#main-group')]:all('.mini-group');
  const groupStates=groups.map(g=>states.filter(s=>s.group===g));
  groupStates.forEach(list=>list.forEach((s,i)=>setOpen(s,i===0,false)));
  await pause(150);
  // Show an exclusive handover, then a full collapse and re-open. This is a
  // single finite sequence, regardless of the manual multiple-open setting.
  for(const step of [1,0,-1,0]){
   if(token!==run)return;
   const pending=[];
   groupStates.forEach(list=>list.forEach((s,i)=>pending.push(setOpen(s,i===step))));
   await Promise.all(pending);if(token!==run)return;
   await pause(Math.max(220,380*(speed||1)));
  }
  if(token===run){playing=false;updatePlay();}
 }
 function accordion(id,title,count,body,open=false){return `<section class="accordion" data-initial="${open?'open':'closed'}"><h3><button class="accordion-trigger" id="${id}-trigger" aria-controls="${id}-panel" aria-expanded="${open}"><svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">${icons.chevron}</svg><span class="section-title">${title}</span><span class="section-count">${count}</span></button></h3><div class="panel-outer" id="${id}-panel" role="region" aria-labelledby="${id}-trigger" ${open?'':'hidden'}><div class="panel-inner">${body}</div></div></section>`;}
 function horizon(mini=false){return `<div class="data-row"><div><div class="row-title">CP <span class="muted">${t('Planlama ufku','Planning horizon')}</span></div><div class="row-description">${t('Yalnızca CP Tracker’ı besler; bağımsız yenilenebilir.','Feeds CP Tracker only; it can be refreshed on its own.')}</div><div class="row-tags"><span><small>ASAS</small><b>CP horizon</b></span><span><small>IAS</small>CP horizon</span></div></div>${mini?'':`<span class="row-action">${icon('filter',12)}${t('Filtre','Filter')}</span>`}</div><div class="data-row"><div><div class="row-title">${t('Diğer modüller','Other modules')}</div><div class="row-description">Orders · Backlog · LFL Analysis · Price & Supplier Analysis</div><div class="row-tags"><span><small>ASAS</small><b>Orders horizon</b></span><span><small>IAS</small>Orders horizon</span></div></div>${mini?'':`<span class="row-action">${icon('refresh',12)}${t('Ortak yenileme','Shared refresh')}</span>`}</div>${mini?'':`<div class="data-row"><div><div class="row-title">INTAKE</div><div class="row-description">${t('Bağımsız kaynak ve filtre; kendi ekranından yenilenir.','Independent source and filter; refreshes from its own screen.')}</div><div class="row-tags"><span><small>INTAKE</small><b>Demo intake source</b></span></div></div><span class="row-action">${icon('filter',12)}${t('Filtre','Filter')}</span></div><div class="refresh-settings"><div class="setting"><div><label for="auto-refresh">${t('Otomatik yenileme','Auto refresh')}</label><small>${t('Periyodik güncelleme aralığı','Periodic refresh interval')}</small></div><select id="auto-refresh"><option>${t('Kapalı','Off')}</option><option>${t('5 dakika','5 minutes')}</option><option>${t('15 dakika','15 minutes')}</option></select></div><div class="setting"><div><label for="source-update">${t('Kaynak değişince güncelle','Update on source change')}</label><small>${t('Kaynak güncellemelerini takip et','Track source updates')}</small></div><input id="source-update" type="check  function tools(mini=false){return `<div class="tools-list">${[
 ['calendar','Merch Calendar','Merch Calendar','LCW hafta, ay ve ay-hafta takvimini yönet.','Manage the LCW week, month and month-week calendar.'],
 ['ship','Transfer süreleri','Transfer lead times','Üretim ülkesi ve taşıma tipine göre transit süreleri.','Transit days by production country and shipment type.'],
 ['tag','Sipariş önem etiketleri','Order importance tags','BTS, Transition, Eid ve özel sipariş kuralları.','BTS, Transition, Eid and special order rules.'],
 ['db','Landed çarpanları','Landed multipliers','Yurt içi ve yurt dışı landed maliyet çarpanları.','Domestic and overseas landed cost multipliers.']
 ].slice(0,mini?2:4).map(([ic,tr,en,dtr,den])=>`<div class="data-row"><span class="tool-icon">${icon(ic,15)}</span><div><div class="row-title">${t(tr,en)}</div><div class="row-description">${t(dtr,den)}</div></div></div>`).join('')}</div>`;}
 function sources(){return `<div class="data-row"><div><div class="row-title">ASAS <span class="file-type">SQL</span></div><div class="row-description">${t('Sipariş ve planlama alanları için örnek bağlantı.','Illustrative connection for order and planning fields.')}</div><div class="row-tags"><span>${t('5 modül bağlı','5 modules connected')}</span></div></div><span class="row-action">${icon('check',12)}${t('Bağlı','Connected')}</span></div><div class="data-row"><div><div class="row-title">IAS <span class="file-type">SQL</span></div><div class="row-description">${t('Üretim ve sevkiyat alanları için örnek bağlantı.','Illustrative connection for production and shipment fields.')}</div><div class="row-tags"><span>${t('3 modül bağlı','3 modules connected')}</span></div></div><span class="row-action">${icon('check',12)}${t('Bağlı','Connected')}</span></div>`;}
 function renderApp(){
  const nav=(ic,tr,en,active=false)=>`<div class="nav-item ${active?'active':''}">${icon(ic,14)}${t(tr,en)}</div>`;
  $('#application').innerHTML=`<aside class="sidebar" aria-hidden="true"><div class="side-brand"><span class="brand-mark">BL</span><div><strong>Buyer Log</strong><small>${t('Çalışma alanı','Workspace')}</small></div></div><div class="nav-group"><div class="nav-label">HOME</div>${nav('grid','Genel bakış','Overview')}${nav('cloud','LCW AI','LCW AI')}</div><div class="nav-group"><div class="nav-label">PLAN & EXECUTE</div>${nav('calendar','CP Tracker','CP Tracker')}${nav('file','Siparişler','Orders')}${nav('file','Backlog','Backlog')}${nav('ship','Sevkiyat karşılaştırma','Shipping comparison')}</div><div class="nav-group"><div class="nav-label">COMMERCIAL</div>${nav('tag','Koleksiyon','Collection')}${nav('grid','Fiyatlandırma','Pricing desk')}${nav('file','Lisans kartları','License cards')}${nav('grid','LFL analizi','LFL analysis')}</div><div class="nav-group system"><div class="nav-label">SYSTEM</div>${nav('db','Veri yönetimi','Data management',true)}</div></aside><div class="app-main"><header class="app-toolbar"><h2>DATA MANAGEMENT</h2><div class="app-toolbar-right"><span class="sample-tag">${t('Temsili veri','Sample data')}</span><span class="preview-label">${t('CANLI ÖNİZLEME','LIVE PREVIEW')}</span><span class="avatar" aria-hidden="true">BL</span></div></header><div class="app-body"><div class="metrics">${[['ASAS','5',t('Hazır','Ready')],['IAS','3',t('2 alan eşlemesi bekliyor','2 field mappings pending')],['Rapor4','1',t('Hazır','Ready')]].map(([name,count,status],i)=>`<div class="metric"><div class="metric-title">${icon('db',12)}${name}</div><div class="metric-count">${count}<span>${t('modül','modules')}</span></div><div class="metric-warning" ${i!==1?'style="color:var(--ui-text-muted)"':''}>${status}</div></div>`).join('')}</div><div class="data-context"><span class="context-name">DATA MATCHING</span><span class="context-hint">${t('Başlıklara tıklayarak aç / kapat','Click headers to expand / collapse')}</span></div><div class="accordion-group" id="main-group">${accordion('main-horizon',t('HORIZON VE YENİLEME','HORIZON AND REFRESH'),'03',horizon(),true)}${accordion('main-tools',t('ARAÇLAR','TOOLS'),'04',tools())}${accordion('main-sources',t('VERİ KAYNAKLARI','DATA SOURCES'),'02',sources())}</div><div class="app-foot">${icon('info',12)}${t('Önizlemedeki seçimler yalnızca bu HTML içinde geçerlidir.','Preview settings apply only within this HTML file.')}</div></div></div>`;
 }
 function renderComparison(){
  $('#comparison').innerHTML=`<div class="comparison-head"><div><h2>${t('Dört hareket, aynı anda.','Four transitions, at the same time.')}</h2><p>${t('“Birlikte aç / kapat” ile aynı içeriği aynı başlangıçtan karşılaştır.','Use “Toggle together” to compare the same content from the same starting state.')}</p></div><button class="outline-button" id="toggle-together">${t('Birlikte aç / kapat','Toggle together')}</button></div><div class="comparison-grid">${Object.entries(modes).map(([key,p])=>`<article class="compare-card" data-mode="${key}"><div class="compare-heading"><h3><span class="number">${p.n}</span>${t(...p.name)}</h3><span class="compare-timing">${p.ms} ms</span></div><div class="accordion-group mini-group">${accordion(key+'-horizon',t('HORIZON VE YENİLEME','HORIZON AND REFRESH'),'02',horizon(true),true)}${accordion(key+'-tools',t('ARAÇLAR','TOOLS'),'02',tools(true))}</div><p class="compare-description">${t(...p.desc)}</p><button class="compare-select" data-select="${key}" aria-pressed="${mode===key}">${t('Bu seçeneği seç','Choose this option')}</button></article>`).join('')}</div>`;
  $('#toggle-together').addEventListener('click',()=>{
   stopRun();const firsts=all('.mini-group').map(g=>states.find(s=>s.group===g));
   const target=!firsts.every(s=>s.open);
   const promises=[];
   firsts.forEach(s=>{promises.push(setOpen(s,target));if(target&&$('#single-open').checked)states.filter(x=>x.group===s.group&&x!==s).forEach(x=>promises.push(setOpen(x,false)));});
   Promise.all(promises);
  });
  all('[data-select]').forEach(b=>b.addEventListener('click',()=>selectMode(b.dataset.select)));
 }
 function renderOptions(){
  const focusedOption=document.activeElement?.dataset.option;
  $('#options').setAttribute('aria-label',t('Animasyon seçenekleri','Animation options'));
  $('#options').innerHTML=Object.entries(modes).map(([key,p])=>`<button class="option" data-option="${key}" aria-pressed="${key===mode}"><div class="option-top"><span class="option-number">${p.n}</span>${key==='soft'?`<span class="recommend">${t('ÖNERİLEN','RECOMMENDED')}</span>`:''}<span class="radio-dot" aria-hidden="true"></span></div><div class="option-title"><h2>${t(...p.name)}</h2><svg class="curve" viewBox="0 0 64 26" fill="none" aria-hidden="true"><path d="M2 2v21h61" stroke="currentColor" stroke-opacity=".2"/><path d="${p.curve}" stroke="currentColor" stroke-width="1.5"/></svg></div><p>${t(...p.desc)}</p><div class="option-meta"><span>${p.ms} ms · ${t(...p.label)}</span><span class="choose">${key===mode?t('SEÇİLİ','SELECTED'):t('DENE ↗','TRY ↗')}</span></div></button>`).join('');
  all('[data-option]').forEach(b=>b.addEventListener('click',()=>selectMode(b.dataset.option)));
  const p=modes[mode];$('#selection-note').innerHTML=icon('info',14)+`<span><strong>${p.n} / ${t(...p.name)}.</strong> ${t(...p.note)}</span>`;
  $('#choice').innerHTML=`<span class="status-dot"></span>${t('Seçili','Selected')}: ${p.n} · ${t(...p.name)}`;
  all('[data-select]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.select===mode));b.textContent=b.dataset.select===mode?t('Seçili seçenek','Selected option'):t('Bu seçeneği seç','Choose this option');});
  if(focusedOption)$(`[data-option="${focusedOption}"]`)?.focus({preventScroll:true});
 }
 async function selectMode(next){
  stopRun();settleAll();mode=next;renderOptions();
  // Compare cards keep fixed profiles. In the full app, selecting a direction
  // gives one immediate, finite close/open sample using the current section.
  if(view==='app'){
   const token=run,s=states.find(x=>x.group.id==='main-group'&&x.open)||states.find(x=>x.group.id==='main-group');
   if(s){await setOpen(s,false);if(token!==run)return;await pause(100);if(token===run)await setOpen(s,true);}
  }
 }
 function switchView(next){
  stopRun();settleAll();view=next;
  $('#application').hidden=next!=='app';$('#comparison').hidden=next!=='compare';
  $('#view-app').setAttribute('aria-pressed',String(next==='app'));$('#view-compare').setAttribute('aria-pressed',String(next==='compare'));
 }
 function updateTheme(){
  const dark=root.dataset.theme==='dark';$('#theme-button').innerHTML=icon(dark?'sun':'moon',18);
  $('#theme-button').setAttribute('aria-label',t(dark?'Açık temaya geç':'Koyu temaya geç',dark?'Switch to light theme':'Switch to dark theme'));
 }
 function render(){
  stopRun();settleAll();
  const previous=states.map(s=>[s.button.id,s.open]);
  root.lang=lang;document.title=t('Buyer Log · Collapse animasyon seçenekleri','Buyer Log · Collapse animation options');
  all('[data-tr][data-en]').forEach(el=>el.innerHTML=el.dataset[lang]);
  $('#lang-tr').setAttribute('aria-pressed',String(lang==='tr'));$('#lang-en').setAttribute('aria-pressed',String(lang==='en'));
  $('#speed').setAttribute('aria-label',t('Animasyon hızı','Animation speed'));
  $('.workbench').setAttribute('aria-label',t('Animasyon önizlemesi','Animation preview'));
  $('.segments').setAttribute('aria-label',t('Önizleme görünümü','Preview view'));
  renderApp();renderComparison();mountAccordions();
  previous.forEach(([id,open])=>{const s=states.find(x=>x.button.id===id);if(s)setOpen(s,open,false);});
  renderOptions();updateTheme();updatePlay();motionNotice();switchView(view);
 }
 $('#lang-tr').addEventListener('click',()=>{lang='tr';render();});
 $('#lang-en').addEventListener('click',()=>{lang='en';render();});
 $('#theme-button').addEventListener('click',()=>{stopRun();settleAll();root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';updateTheme();});
 $('#view-app').addEventListener('click',()=>switchView('app'));
 $('#view-compare').addEventListener('click',()=>switchView('compare'));
 $('#play').addEventListener('click',play);

  stopRun();if(!e.target.checked)return;

  groups.forEach(g=>{const open=states.filter(s=>s.group===g&&s.open);open.slice(1).forEach(s=>setOpen(s,false));});
 });
 reduced.addEventListener('change',()=>{stopRun();settleAll();motionNotice();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRun();settleAll();}});
 addEventListener('resize',()=>{stopRun();settleAll();});
 // Changing a control is always independent of motion; fast repeated clicks
 // replace the in-flight animation and settle on the latest requested state.
 render();
})();
