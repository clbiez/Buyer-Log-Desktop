<!doctype html>
<html lang="tr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Log · Overview / Design Study</title>
<style>
/* Canonical Buyer Log token snapshot, embedded for an offline design proposal. */
:root{
  --rail-w:208px;
  --rail-min-w:66px;

  /* --- Yüzeyler & metin (aydınlık — mevcut palet korunur) --- */
  --paper:#F6F7F9; --card:#FFFFFF; --card2:#FBFBFC; --ink:#101828; --ink2:#475467; --muted:#98A2B3;
  --line:#E4E7EC; --line2:#D0D5DD;
  /* --- Kimlik rengi --- */
  --acc:#5980A6; --acc-bg:#E9EFF5; --acc-lite:#8FA9C4; --acc-ink:#3E5C7A; --on-acc:#FFFFFF;
  /* --- Durum renkleri --- */
  --red:#A8453A; --red-bg:#F4E7E4; --orange:#8C6A1F; --orange-bg:#F2EAD6;
  --yellow:var(--orange); --yellow-bg:var(--orange-bg); --green:#3F7757; --green-bg:#E3EDE6;
  --gray-bg:#EDEFF1;
  --red-lite:#A8453A; --orange-lite:#8C6A1F; --green-lite:#3F7757; --blue-lite:#5980A6;
  /* --- Eski JS'in kullandığı takma adlar --- */
  --navy:var(--acc); --navy-deep:#2A3E52; --teal:#3F7A6C; --blue:#5980A6; --purple:#6D53A8;
  /* Tablo başlıkları: Gri temanın başlık tonu kullanılır — beyaza yakın yüzey
     yerine belirgin gri zemin. Dışa aktarma ve kopyalama da bu tonu kullanır. */
  --thead-bg:#F2F4F7; --thead-ink:#54595F; --thead-line:#D0D5DD;
  --table-bg:var(--card); --table-ink:var(--ink); --table-border:var(--line);
  --table-hover:#F3F6FA; --table-link:var(--acc-ink);
  --table-editHover:color-mix(in srgb, var(--acc) 7%, transparent);
  --table-editBg:color-mix(in srgb, var(--acc) 12%, var(--card));
  --card2-strong:#D8DBDF;   /* grup başlığı satırı — Gri tema tonu */
  /* --- Yarı saydam panel zemini (popover / menü) --- */
  --pop:color-mix(in srgb, var(--card) 86%, transparent);
  --pop-blur:saturate(1.6) blur(14px);
  /* --- Ölçekler --- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:36px;
  --r-xs:0; --r-sm:0; --r-md:0; --r-lg:0; --r-xl:0; --r-full:999px;
  /* Bilinçli istisnalar: kapsül tutamak/anahtar ve daire (avatar, durum noktası). DESIGN_SYSTEM.md §3 */
  --r-pill:999px; --r-round:50%;
  --ui-scale:1;
  --ui-font-add:0px;
  --fs-xs:calc(11px + var(--ui-font-add)); --fs-sm:calc(12px + var(--ui-font-add)); --fs-base:calc(12.5px + var(--ui-font-add)); --fs-md:calc(14px + var(--ui-font-add)); --fs-lg:calc(16px + var(--ui-font-add)); --fs-xl:calc(20px + var(--ui-font-add));
  /* Tam yazı ölçeği: tüm modüller yalnız bu adımları kullanır (DESIGN_SYSTEM.md §2). */
  --fs-2xs:calc(10.5px + var(--ui-font-add)); --fs-2xl:calc(24px + var(--ui-font-add)); --fs-3xl:calc(30px + var(--ui-font-add)); --fs-4xl:calc(40px + var(--ui-font-add));
  --kol-cell-fs:calc(12px + var(--ui-font-add));
  --ctl-h:34px;
  --ctl-h-sm:calc(var(--ctl-h) - 8px);
  /* Doygun dolgu üzerindeki yazı ve modal perdesi: tema değişse de aynı kalır (DESIGN_SYSTEM.md §5). */
  --on-solid:#fff; --scrim:rgba(8,12,18,.48);
  /* Kategorik grafik paleti — dataviz doğrulayıcısından geçti (CVD ΔE ≥ 8, normal ΔE ≥ 15). Sıra sabittir. */
  --chart-1:#2a78d6; --chart-2:#eb6834; --chart-3:#1baf7a; --chart-4:#eda100; --chart-5:#e87ba4; --chart-6:#008300; --chart-7:#6250d6; --chart-8:#e34948;
  --table-row-h:32px;
  --table-group-head-h:29px;
  --table-head-pad-y:8px;
  --table-cell-pad-y:7px;
  --table-edit-pad-y:2px;
  --rail-item-h:36px;
  --rail-foot-h:34px;
  --rail-control-size:30px;
  --icon-btn-size:34px;
  --topbar-h:52px;
  --control-sm:calc(var(--ctl-h) - 4px);
  --control-md:var(--ctl-h);
  --control-lg:calc(var(--ctl-h) + 6px);
  --page-padding:var(--sp-5);
  --section-gap:var(--sp-4);
  --card-padding:var(--sp-4);
  --toolbar-height:var(--ctl-h);
  --shadow-1:0 1px 2px rgba(16,24,40,.05);
  --shadow-2:0 4px 12px rgba(16,24,40,.07), 0 1px 3px rgba(16,24,40,.06);
  --shadow-3:0 16px 40px rgba(16,24,40,.14), 0 3px 10px rgba(16,24,40,.07);
  --shadow-lg:var(--shadow-3);
  --focus-ring:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent);
  --ease:cubic-bezier(.2,.7,.3,1);
  /* --- Uydu stiller için tema köprüleri (lfl / open-costing / js şablonları) --- */
  --success:var(--green); --warning:var(--orange); --danger:var(--red); --error:var(--red);
  --info:var(--acc); --on-primary:var(--on-acc);
  --hover:var(--card2-strong); --row-hover:var(--table-hover);
  --acc-hover:color-mix(in srgb, var(--acc) 88%, #000 12%); --line3:var(--line2);
  --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,monospace;
  --sans:"Barlow","Segoe UI Variable Text","Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;
  --heading:"Barlow Condensed",var(--sans);
}
:root{
  --rail-w:216px;

  /* Industry açık zemin */
  --paper:#f2f2f3; --rail-bg:#ececed; --card:#f8f8f9; --card2:#f5f5f8;
  --card2-strong:#e7e7ea;
  --ink:#1d1f20; --ink2:#5d5d60; --muted:#7a7a7d;
  --line:#d4d4d7; --line2:#b7b7ba;
  --hair:color-mix(in srgb, #1d1f20 12%, transparent);
  --hair-2:color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tek vurgu: çelik mavisi */
  --acc:#3f6488; --acc-bg:#e6edf4; --acc-lite:#7fa3c6; --acc-ink:#2c455d; --on-acc:#f2f2f3;
  --navy:var(--acc); --navy-deep:#1d2d3d; --blue:var(--ink2); --teal:var(--ink2); --purple:var(--ink2); --blue-lite:var(--ink2);

  /* Kare köşeler — blueprint dili */
  --r-xs:0px; --r-sm:0px; --r-md:0px; --r-lg:0px; --r-xl:0px; --r-full:0px;

  /* 0.85x yoğunluk ölçeği */
  --sp-1:3.4px; --sp-2:6.8px; --sp-3:10.2px; --sp-4:13.6px;
  --sp-5:20.4px; --sp-6:27.2px; --sp-7:34px;

  /* Tipografi */
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:"Barlow Condensed",var(--sans);
  --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,monospace;

  /* Zemin tonuna göre ayarlı gölge */
  --shadow-1:0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-2:0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-3:0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
  --shadow-lg:var(--shadow-3);
  --focus-ring:0 0 0 2px var(--paper), 0 0 0 3px var(--acc);

  --table-hover:color-mix(in srgb, #1d1f20 4%, transparent);
  --table-link:var(--acc-ink);
  --hover:var(--card2-strong); --row-hover:var(--table-hover);
  --acc-hover:#2f4d6b; --line3:var(--line2);
  --primary:var(--acc); --on-primary:var(--on-acc); --primary-hover:var(--acc-hover);

  /* Blueprint köşe işareti */
  --mark:9px;
  --mark-ink:color-mix(in srgb, var(--ink) 45%, transparent);
}
:root{
  --bl-neutral-0:#fff;
  --bl-neutral-25:#fafbfc;
  --bl-neutral-50:#f5f7f9;
  --bl-neutral-100:#e9edf1;
  --bl-neutral-200:#d9e0e7;
  --bl-neutral-500:#677586;
  --bl-neutral-700:#374454;
  --bl-neutral-900:#16212d;
  --bl-blue-600:#356a96;
  --bl-blue-700:#275779;
  --bl-blue-50:#eaf2f8;

  --paper:var(--bl-neutral-50);
  --rail-bg:#f0f3f6;
  --card:var(--bl-neutral-0);
  --card2:var(--bl-neutral-25);
  --card2-strong:var(--bl-neutral-100);
  --ink:var(--bl-neutral-900);
  --ink2:var(--bl-neutral-700);
  --muted:#627184;
  --line:var(--bl-neutral-100);
  --line2:var(--bl-neutral-200);
  --hair:var(--line);
  --hair-2:var(--line2);
  --acc:var(--bl-blue-600);
  --acc-hover:var(--bl-blue-700);
  --acc-bg:var(--bl-blue-50);
  --acc-ink:#245578;
  --on-acc:#fff;
  --pop:var(--card);
  --pop-blur:none;

  --bl-surface-page:var(--paper);
  --bl-surface-panel:var(--card);
  --bl-surface-soft:var(--card2);
  --bl-surface-raised:var(--pop);
  --bl-stroke-subtle:var(--line);
  --bl-stroke-strong:var(--line2);
  --bl-text-primary:var(--ink);
  --bl-text-secondary:var(--ink2);
  --bl-text-muted:var(--muted);

  /* Refined Industry: etkileşim geometrisi bilinçli olarak köşelidir. */
  --r-xs:0px;--r-sm:0px;--r-md:0px;--r-lg:0px;--r-xl:0px;
  --r-full:0px;
  --bl-radius-control:var(--r-sm);
  --bl-radius-panel:var(--r-lg);
  --bl-radius-float:var(--r-lg);
  --bl-motion-fast:110ms;
  --bl-motion-standard:170ms;
  --bl-motion-enter:190ms;
  --bl-ease:cubic-bezier(.2,.75,.25,1);
  --shadow-1:0 1px 2px rgba(23,37,51,.05);
  --shadow-2:0 5px 18px rgba(23,37,51,.08);
  --shadow-3:0 16px 42px rgba(23,37,51,.17),0 2px 7px rgba(23,37,51,.08);
  --focus-ring:0 0 0 3px color-mix(in srgb,var(--acc) 27%,transparent);
  --fs-xs:calc(11.5px + var(--ui-font-add));
  --fs-sm:calc(12.5px + var(--ui-font-add));
  --fs-base:calc(13px + var(--ui-font-add));
  --fs-md:calc(14.5px + var(--ui-font-add));
  --heading:var(--sans);
  --head:var(--sans);
}

function attention(){return `<section class="panel attention animate-in" style="--delay:150ms"><div class="panel-head"><h2>${L('Önce bunlara bak','Focus first')}</h2><div class="aside"><span style="color:var(--red)">● 12 ${L('kritik','critical')}</span></div></div><div class="mix" title="${L('Demo öncelik dağılımı','Demo priority mix')}"><i></i><i style="flex:2"></i><i></i><i></i></div><div class="attention-list">${[[L('PPS onayı bekliyor','PPS approval pending'),'DM-2408 · BD',8],[L('Yükleme tarihi aşıldı','Loading date passed'),'DM-2416 · EG',5],[L('Retail tarihi riskte','Retail date at risk'),'DM-2422 · TR',3]].map((a,i)=>`<button class="action" data-detail="order${i}"><span class="thumb">${tshirt(i)}</span><span class="action-content"><b>${a[0]}</b><small class="mono">${a[1]}</small></span><span class="delta">${i===2?'−':'+'}${a[2]}${L('g','d')}<small>${i===2?L('tampon','buffer'):L('gecikme','delay')}</small></span><span class="muted">↗</span></button>`).join('')}</div><div class="attention-footer"><span>◷ ${L('Kontrol listesi','Checklist')} <b>8/12</b></span><button data-detail="priorities">${L('Tümü','View all')} →</button></div></section>`;}
function deadlines(){let names=state.period?[L('26 Pt','26 Mo'),L('27 Sa','27 Tu'),L('28 Ça','28 We'),L('29 Pe','29 Th'),L('30 Cu','30 Fr'),L('31 Ct','31 Sa'),L('01 Pa','01 Su')]:[L('19 Pt','19 Mo'),L('20 Sa','20 Tu'),L('21 Ça','21 We'),L('22 Pe','22 Th'),L('23 Cu','23 Fr'),L('24 Ct','24 Sa'),L('25 Pa','25 Su')];return `<section class="panel deadline animate-in" style="--delay:220ms"><div class="panel-head"><h2>${L('Termin ufku','Delivery horizon')}</h2><div class="aside"><button data-period>${state.period?L('Sonraki hafta','Next week'):L('Bu hafta','This week')} ⇄</button></div></div><div class="timeline"><div class="days">${[18,31,24,46,37,12,8].map((n,i)=>{const v=state.period?n+((i*7)%13):n;return `<button class="day" data-day="${i}" aria-label="${names[i]}, ${v} ${L('sipariş, demo','orders, demo')}"><b>${v}</b><span class="bar" style="--h:${v*1.7}px;--risk:${[10,33,12,28,19,0,0][i]}%;--delay:${i*55}ms"></span><span>${names[i]}</span></button>`}).join('')}</div></div><div class="legend"><span><i></i>${L('Planlı yükleme','Planned loading')}</span><span><i class="red"></i>${L('Riskteki pay','At-risk share')}</span><span style="margin-left:auto">${L('7 GÜN','7 DAYS')}</span></div></section>`;}
function breakdown(){const datasets=[[[L('Bangladeş','Bangladesh'),38],[L('Mısır','Egypt'),26],[L('Türkiye','Türkiye'),22],[L('Diğer','Other'),14]],[['6W26',62],['6S27',26],['6W27',12]]];return `<section class="panel breakdown animate-in" style="--delay:260ms"><div class="panel-head"><h2>${L('Sipariş dağılımı','Order mix')}</h2><div class="aside"><button data-dim>${state.dim?L('Sezon','Season'):L('Ülke','Country')} ⇄</button></div></div><div class="bars">${datasets[state.dim].map((r,i)=>`<button class="break-row" data-break="${i}"><span class="labels"><span>${r[0]}</span><b class="mono">${r[1]}%</b></span><div class="track"><div class="fill" style="--w:${r[1]*1.6}%;opacity:${1-i*.15};animation-delay:${i*80}ms"></div></div></button>`).join('')}</div></section>`;}
function collection(){return `<section class="panel collection animate-in" style="--delay:300ms"><div class="panel-head"><h2>${L('Koleksiyon vitrini','Collection showcase')}</h2><div class="aside"><button data-detail="collection">${L('EKİM','OCTOBER')} ↗</button></div></div><div class="products">${[0,1,2,3].map(i=>`<button class="product" data-detail="model${i}" aria-label="${L('Demo model detayı','Demo model details')} ${i+1}">${tshirt(i)}</button>`).join('')}</div><div class="collection-summary"><b>128</b><span>${L('model','models')}</span><b style="margin-left:auto;font-size:var(--fs-md)">68%</b><span>${L('teyitli','confirmed')}</span></div><div class="status-track" title="${L('Demo statü dağılımı','Demo status mix')}"><i style="--weight:32"></i><i style="--weight:48"></i><i style="--weight:20"></i></div><div class="legend" style="padding-top:2px">${L('Geliştirme · Teyitli · Bekliyor','Development · Confirmed · Pending')}</div></section>`;}
function commercial(){return `<div class="commercial-grid">${collection()}<section class="panel oab animate-in" style="--delay:140ms"><div class="panel-head"><h2>${L('OAB · Bütçe dengesi','OAB · Budget balance')}</h2><div class="aside"><span class="badge">6W26 · KIDS</span><button data-detail="oab">${L('Pivot','Pivot')} ↗</button></div></div><div class="budget"><div class="budget-ring"><svg viewBox="0 0 130 130" aria-hidden="true"><circle cx="65" cy="65" r="56"/><circle class="arc" cx="65" cy="65" r="56"/></svg><div class="ring-label"><b>71%</b><small>${L('kullanım','utilisation')}</small></div></div><div class="budget-values"><div><span>${L('Güncel bütçe','Current budget')}</span><b>2,40M</b></div><div><span>${L('Sipariş','Ordered')}</span><b>1,70M</b></div><div><span>${L('Kullanılabilir','Available')}</span><b>700K</b></div><small>${L('Örnek ölçü: adet · kapsam: 6W26 / KIDS','Example unit: pieces · scope: 6W26 / KIDS')}</small></div></div><div class="legend">${L('Veri kaynağı ve ölçü eşlemesi uygulamada doğrulanacak.','Source and measure mapping must be verified in implementation.')}</div></section><section class="panel intake animate-in" style="--delay:220ms"><div class="panel-head"><h2>${L('INTAKE · Plan / Sipariş','INTAKE · Plan / Orders')}</h2><div class="aside"><span>${L('ÖRNEK ÖLÇÜ: ADET','EXAMPLE UNIT: PIECES')}</span><button data-detail="intake">↗</button></div></div><div class="intake-chart">${[[L('Ekim','October'),71,83],[L('Kasım','November'),55,73],[L('Aralık','December'),42,65]].map((a,i)=>`<button class="bullet-row" style="border:0;background:transparent;width:100%;padding:0" data-budget="${i}"><span>${a[0]}</span><span class="bullet" style="--w:${a[1]}%;--target:${a[2]}%"></span><b>${a[1]}%</b></button>`).join('')}</div><div class="legend"><span><i></i>${L('Sipariş / bütçe','Orders / budget')}</span><span>│ ${L('Plan / bütçe','Plan / budget')}</span></div></section><section class="panel insight animate-in" style="--delay:260ms"><div class="panel-head"><h2>${L('Yükleme yoğunluğu','Loading concentration')}</h2><div class="aside"><span class="badge">${L('YENİ WIDGET','NEW WIDGET')}</span></div></div><div class="insight-body"><span class="insight-number">+18%</span><p>${L('Kasım planında Ekim’e göre daha yoğun bir yükleme haftası var.','November has a heavier planned loading week than October.')}</p><button data-detail="capacity">${L('Dağılımı incele','Inspect distribution')} ↗</button></div></section></div>`;}
function render(){document.documentElement.lang=state.lang;document.documentElement.dataset.theme=state.theme;document.body.classList.toggle('motion-off',!state.motion);$('#app').innerHTML=`<div class="shell"><aside class="rail" aria-label="${L('Demo gezinme','Demo navigation')}"><div class="brand">BL</div><button class="${state.view==='operations'?'active':''}" data-view="operations" title="${L('Operasyon','Operations')}">▦</button><button class="${state.view==='commercial'?'active':''}" data-view="commercial" title="${L('Ticari','Commercial')}">▥</button><button data-detail="notes" title="${L('Notlar','Notes')}">▤</button><span class="rail-bottom">BUYER LOG / DESIGN STUDY</span></aside><main><header class="topbar"><div><div class="subtitle">BUYER LOG / CONTROL DESK</div><h1>${L('Genel Bakış','Overview')}</h1></div><span class="badge demo">${L('TASARIM DEMOSU · TÜM VERİLER TEMSİLİ','DESIGN DEMO · ALL DATA ILLUSTRATIVE')}</span><div class="controls"><select aria-label="${L('Tema','Theme')}" id="theme"><option value="dark" ${state.theme==='dark'?'selected':''}>${L('Gece','Dark')}</option><option value="light" ${state.theme==='light'?'selected':''}>${L('Açık','Light')}</option><option value="grey" ${state.theme==='grey'?'selected':''}>${L('Kurşun','Slate')}</option></select><button id="motion" aria-pressed="${state.motion}">${state.motion?'II':'>'} ${L('Hareket','Motion')}</button><button id="replay" title="${L('Açılış animasyonunu tekrar oynat','Replay entrance animation')}">↻</button><button id="lang">${state.lang==='tr'?'EN':'TR'}</button></div></header><div class="workspace"><div class="strip"><nav class="scope" aria-label="${L('Demo ekran seçimi','Demo screen selection')}"><button data-view="operations" class="${state.view==='operations'?'active':''}">${L('Operasyon','Operations')}</button><button data-view="commercial" class="${state.view==='commercial'?'active':''}">${L('Ticari','Commercial')}</button></nav><span class="badge">6W26 / ${L('TÜM ÜLKELER','ALL COUNTRIES')}</span><div class="clocks" aria-label="${L('Canlı yerel saatler','Live local clocks')}">${[['TR','Europe/Istanbul'],['BD','Asia/Dhaka'],['IN','Asia/Kolkata'],['CN','Asia/Shanghai']].map(([id,zone])=>`<span><i class="dot"></i>${id} <b data-zone="${zone}">--:--</b></span>`).join('')}</div></div><div class="kpis">${[[L('Aktif portföy','Active portfolio'),nf(1284),L('sipariş','orders'),L('7 günlük temsili trend','Illustrative 7-day trend')],[L('Müdahale gerekli','Action needed'),'12',L('kritik','critical'),L('42 sipariş bugün takipte','42 orders to follow today')],[L('Bu hafta yükleme','Loading this week'),'286K',L('adet','units'),L('18 planlı sevkiyat','18 planned shipments')],[L('Koleksiyon','Collection'),'128',L('model','models'),L('87 model teyitli','87 models confirmed')]].map((a,i)=>`<button class="kpi animate-in ${i===1?'risk':''}" style="--delay:${i*40}ms" data-detail="kpi${i}"><span class="eyebrow">${a[0]}</span><span class="value"><b data-count="${i}">${a[1]}</b><span class="unit">${a[2]}</span></span><div class="foot">${a[3]}</div>${spark(i)}</button>`).join('')}</div>${state.view==='operations'?`<div class="grid">${map()}${attention()}${deadlines()}${breakdown()}${collection()}</div>`:commercial()}<div class="bottom"><span class="dot"></span><span>${L('Veri zamanı','Data as of')} <b class="mono">18.10.2026 · 09:42</b> <span class="badge demo">DEMO</span></span><span class="note-pill">▤ <b>3</b> ${L('kişisel not','personal notes')}</span><button data-detail="notes">${L('Notlara bak','View notes')} ↗</button><div class="quality"><span class="quality-grid">${Array.from({length:14},()=>'<i></i>').join('')}</span><span>${L('Tarih kapsamı','Date coverage')} <b>94%</b></span><button data-detail="coverage">${L('Eksikler','Missing')} ↗</button></div></div><footer class="proposal-footer"><span>${L('Öneri 01 · Görsel komuta masası · Ürün silüetleri örnektir.','Proposal 01 · Visual control desk · Product silhouettes are illustrative.')}</span><span>${L('Grafiklere, rotalara ve ürünlere tıkla.','Click charts, routes and products.')}</span></footer></div></main></div>`;$('#app').innerHTML=$('#app').innerHTML.replaceAll('↗','<svg class="inline-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9L9 3M3 3h6v6"/></svg>').replaceAll('⇄','<svg class="inline-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4h9L8 2M11 8H2l2 2"/></svg>');tick();animateCounts();}
let countFrame=0;
function animateCounts(){cancelAnimationFrame(countFrame);if(!state.motion||reduced.matches)return;const nodes=[...document.querySelectorAll('[data-count]')],end=[1284,12,286,128],start=performance.now();function frame(t){let p=Math.min(1,(t-start)/850),e=1-Math.pow(1-p,3);nodes.forEach((n,i)=>{n.textContent=nf(Math.round(end[i]*e))+(i===2?'K':'');});if(p<1)countFrame=requestAnimationFrame(frame);}countFrame=requestAnimationFrame(frame);}
function tick(){const now=new Date();document.querySelectorAll('[data-zone]').forEach(n=>{n.textContent=new Intl.DateTimeFormat(state.lang==='en'?'en-GB':'tr-TR',{timeZone:n.dataset.zone,hour:'2-digit',minute:'2-digit'}).format(now);});}
setInterval(()=>{if(!document.hidden)tick();},30000);
const titles={notes:()=>L('Kişisel notlar','Personal notes'),coverage:()=>L('Veri kapsamı','Data coverage'),map:()=>L('Global akış · Demo detay','Global flow · Demo detail'),collection:()=>L('Koleksiyon · Ekim','Collection · October'),priorities:()=>L('Üretim öncelikleri','Production priorities'),oab:()=>L('OAB · Bütçe detayı','OAB · Budget detail'),intake:()=>L('INTAKE · Plan detayı','INTAKE · Plan detail'),capacity:()=>L('Yükleme yoğunluğu','Loading concentration')};
function detail(id,extra=''){const dlg=$('#detail');let title=titles[id]?titles[id]():L('Operasyon detayı','Operation detail'),body=L('Özet grafikteki seçimin ilgili siparişlere, filtreleri korunarak açıldığı detay akışı.','Detail flow: a chart selection opens the corresponding orders with its filters preserved.');if(id==='coverage')body=L('94/100 siparişte gerekli hedef ve yükleme tarihleri mevcut. Kalan 6 kayıtta tarih eksik. Bu oran bir genel sağlık puanı değildir.','94/100 orders have required target and loading dates. Six records have missing dates. This is not an overall health score.');if(id==='notes')body=L('Yalnız kendi notların: “PPS yanıtını takip et” · 3 sipariş. Not metni tıklanınca genişler; silme ve düzenleme detayda kalır.','Only your notes: “Follow up PPS reply” · 3 orders. Click to expand the note; edit and delete stay in detail.');if(id==='oab'||id==='intake')body=L('Grafikten detay pivotuna geçiş. Gerçek uygulamada seçili sezon / grup / ölçü korunur; OAB ve INTAKE verileri ayrı kaynaklardan okunur.','Chart-to-pivot detail flow. Implementation preserves season / group / measure; OAB and INTAKE retain separate data sources.');if(id==='kpi0')body=L('1284 aktif sipariş. Mini trend için önceki günlük özetlerin saklanması gerekir; mevcut tek anlık görüntü geçmiş trendi kanıtlamaz.','1284 active orders. A trend requires stored daily aggregates; the current snapshot alone does not establish a historical trend.');if(id.startsWith('order'))title=L('DM-2408 · Aksiyon detayı','DM-2408 · Action detail');if(id.startsWith('model'))title=L('Koleksiyon · Model görseli','Collection · Model visual');if(extra)title=extra;dlg.innerHTML=`<div class="panel-head"><h2 id="detail-title">${title}</h2><button class="dialog-close" data-close aria-label="${L('Kapat','Close')}">×</button></div><div class="dialog-content"><span class="badge demo">${L('TEMSİLİ DETAY · ÜRETİM SİSTEMİNE BAĞLI DEĞİL','ILLUSTRATIVE DETAIL · NOT CONNECTED TO PRODUCTION')}</span>${id.startsWith('model')?`<div style="height:180px;display:grid;place-items:center">${tshirt(Number(id.slice(-1)))}</div>`:''}<p>${body}</p><div class="metrics"><div><b>${id==='coverage'?'6':'12'}</b><span>${L('örnek kayıt','example records')}</span></div><div><b>${id==='coverage'?'94%':'286K'}</b><span>${id==='coverage'?L('tarih kapsamı','date coverage'):L('örnek adet','example units')}</span></div></div><p class="context">${L('Bu prototip görsel hiyerarşi, animasyon ve detay açılışını gösterir. Sayılar, trendler, görseller ve rotalar demo veridir.','This prototype demonstrates visual hierarchy, motion and detail opening. Metrics, trends, images and routes are demo data.')}</p><button data-close>${L('Ekrana dön','Back to overview')}</button></div>`;dlg.showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-route]');if(!b)return;if(b.id==='theme')return;if(b.id==='lang'){state.lang=state.lang==='tr'?'en':'tr';render();return;}if(b.id==='motion'){state.motion=!state.motion;render();return;}if(b.id==='replay'){render();return;}if(b.hasAttribute('data-view')){state.view=b.dataset.view;render();return;}if(b.hasAttribute('data-dim')){state.dim=1-state.dim;render();return;}if(b.hasAttribute('data-period')){state.period=1-state.period;render();return;}if(b.hasAttribute('data-close')){$('#detail').close();return;}if(b.hasAttribute('data-route')){const r=routes.find(r=>r.id===b.dataset.route);detail('map',`${r.label} → ISTANBUL · ${r.q}`);return;}if(b.hasAttribute('data-day')){detail('timeline',L('Günlük termin · Demo','Daily delivery horizon · Demo'));return;}if(b.hasAttribute('data-break')){detail('breakdown',L('Kırılım · Filtreli detay','Breakdown · Filtered detail'));return;}if(b.hasAttribute('data-budget')){detail('intake');return;}if(b.dataset.detail)detail(b.dataset.detail);});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-route]');if(n&&['Enter',' '].includes(e.key)){e.preventDefault();n.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='theme'){state.theme=e.target.value;render();}});
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('motion-off',document.hidden||!state.motion);document.querySelectorAll('.map-area svg').forEach(svg=>{if(document.hidden||!state.motion)svg.pauseAnimations?.();else svg.unpauseAnimations?.();});if(!document.hidden)tick();});
reduced.addEventListener('change',()=>{if(reduced.matches)state.motion=false;render();});
render();
</script></body></html>
