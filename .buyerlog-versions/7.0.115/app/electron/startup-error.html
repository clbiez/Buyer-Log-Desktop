<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<title>Buyer Log</title>
<!-- Mevcut görsel kimlik korunur: token'lar projenin kendi design.css'inden gelir.
     Yeni bir paralel UI stili üretilmedi (bkz. CLAUDE.md §9). Stil dosyası bir
     nedenle yüklenemezse aşağıdaki yedek değerler sayfayı yine okunur tutar. -->
<link rel="stylesheet" href="../public/design.css">
<style>
  :root{
    --paper:#f2f2f3; --card:#f8f8f9; --ink:#1d1f20; --ink2:#5d5d60; --muted:#7a7a7d;
    --line:#d4d4d7; --acc:#3f6488; --acc-hover:#2f4d6b; --on-acc:#f2f2f3;
    --sans:"Barlow",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    --head:"Barlow Condensed",var(--sans); --mono:"Cascadia Code",Consolas,monospace;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .shell{width:100%; max-width:640px;}
  .badge{
    font-family:var(--head); text-transform:uppercase; letter-spacing:.08em;
    font-size:12px; color:var(--muted); margin-bottom:6px;
  }
  h1{font-family:var(--head); font-size:26px; margin:0 0 14px; font-weight:600;}
  .panel{
    background:var(--card); border:1px solid var(--line); padding:18px 20px; margin-bottom:14px;
  }
  .panel h2{
    font-family:var(--head); text-transform:uppercase; letter-spacing:.06em;
    font-size:12px; color:var(--muted); margin:0 0 8px; font-weight:600;
  }
  pre{
    font-family:var(--mono); font-size:12px; white-space:pre-wrap; word-break:break-word;
    margin:0; color:var(--ink2); max-height:220px; overflow:auto;
  }
  .hint{color:var(--ink2); margin:0;}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  button{
    font-family:var(--sans); font-size:14px; padding:9px 18px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  button.primary{background:var(--acc); border-color:var(--acc); color:var(--on-acc);}
  button.primary:hover{background:var(--acc-hover); border-color:var(--acc-hover);}
  button:disabled{opacity:.55; cursor:default;}
  #diagnostics{display:none;}
  #diagnostics.open{display:block;}
</style>
</head>
<body>
  <div class="shell">
    <div class="badge">Buyer Log</div>
    <h1 id="title">Buyer Log başlatılamadı.</h1>

    <div class="panel">
      <h2>Ayrıntı</h2>
      <pre id="detail">Yükleniyor…</pre>
    </div>

    <div class="panel">
      <h2>Ne yapabilirsiniz</h2>
      <p class="hint" id="hint"></p>
    </div>

    <div class="panel" id="diagnostics">
      <h2>Teşhis</h2>
      <pre id="diagnosticsBody"></pre>
    </div>

    <div class="actions">
      <!-- Yalnız portu başka bir kopya tuttuğunda görünür (kind: port-occupied). -->
      <button class="primary" id="closeOther" hidden>Çalışan Kopyayı Kapat</button>
      <button class="primary" id="retry">Tekrar Dene</button>
      <button id="toggleDiagnostics">Teşhis</button>
      <button id="openLogs">Günlük Klasörü</button>
      <button id="exit">Çıkış</button>
    </div>
  </div>

<script>
/* Bu sayfa sandbox içinde çalışır; Node yoktur. Ana süreçle tek bağlantısı
   preload'un açtığı sabit isimli kanallardır (bkz. electron/preload.js). */
const desktop = window.buyerLogDesktop || null;
const $ = id => document.getElementById(id);

async function render() {
  if (!desktop) { $('detail').textContent = 'Masaüstü köprüsü yüklenemedi.'; return; }
  const failure = await desktop.startupFailure();
  if (failure) {
    $('title').textContent = failure.message || 'Buyer Log başlatılamadı.';
    $('detail').textContent = failure.detail || '(ayrıntı yok)';
    $('hint').textContent = failure.hint || '';
  } else {
    $('detail').textContent = '(ayrıntı yok)';
  }

  /* Kapatma düğmesi YALNIZ portu başka bir kopya tuttuğunda ve o kopya
     doğrulanabildiğinde çıkar. Doğrulanamayan bir süreç için düğme
     göstermek, kullanıcıya tutmayacağı bir söz vermektir. */
  const button = $('closeOther');
  button.hidden = true;
  if (!failure || failure.kind !== 'port-occupied') return;
  try {
    const owner = await desktop.inspectPort();
    if (owner && owner.closable) {
      button.hidden = false;
      button.textContent = 'Çalışan Kopyayı Kapat';
    } else if (owner && owner.reason) {
      $('hint').textContent = owner.reason + ' Kapattıktan sonra Tekrar Dene.';
    }
  } catch (_) { /* inceleme yapılamazsa düğme gösterilmez */ }
}

$('retry').addEventListener('click', async () => {
  const button = $('retry');
  button.disabled = true;
  button.textContent = 'Deneniyor…';
  const started = await desktop.retryStartup();
  if (!started) {
    button.disabled = false;
    button.textContent = 'Tekrar Dene';
    await render();
  }
});

$('closeOther').addEventListener('click', async () => {
  const button = $('closeOther');
  const retry = $('retry');
  button.disabled = true; retry.disabled = true;
  button.textContent = 'Kapatılıyor…';
  try {
    const result = await desktop.closeOtherInstance();
    if (result && result.ok && result.started) return; // pencere açıldı, bu ekran kapanıyor
    if (result && result.ok) {
      $('title').textContent = 'Çalışan kopya kapatıldı.';
      $('hint').textContent = 'Buyer Log yine de açılamadı. Tekrar Dene ile deneyebilir, '
        + 'Teşhis ile ayrıntıya bakabilirsiniz.';
    } else {
      $('hint').textContent = (result && result.message)
        || 'Çalışan kopya kapatılamadı. Pencereyi elle kapatıp Tekrar Dene.';
    }
  } catch (error) {
    $('hint').textContent = 'Kapatma sırasında hata: ' + (error && error.message);
  }
  button.disabled = false; retry.disabled = false;
  button.textContent = 'Çalışan Kopyayı Kapat';
});

$('toggleDiagnostics').addEventListener('click', async () => {
  const panel = $('diagnostics');
  if (panel.classList.contains('open')) { panel.classList.remove('open'); return; }
  const info = await desktop.diagnostics();
  $('diagnosticsBody').textContent = Object.entries(info)
    .map(([key, value]) => key + ' : ' + (value && typeof value === 'object' ? JSON.stringify(value) : String(value)))
    .join('\n');
  panel.classList.add('open');
});

$('openLogs').addEventListener('click', () => desktop.openLogFolder());
$('exit').addEventListener('click', () => desktop.quit());

render();
</script>
</body>
</html>
